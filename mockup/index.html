   <div class="box"><span class="k">${L('Reporting live','Dey report live')}</span><span class="v">${live}<small>/ ${BLD.length}</small></span><span class="s">${BLD.length-live?L(`${BLD.length-live} offline`,`${BLD.length-live} no dey answer`):L('all controllers online','all controllers dey online')}</span></div>
   <div class="box"><span class="k">${L('Power now','Light now')}</span><span class="v esrc"><i class="d nepa"></i>${cnt('nepa')} <i class="d gen"></i>${cnt('gen')} <i class="d inv"></i>${cnt('inv')} <i class="d off"></i>${cnt('off')}</span><span class="s">NEPA · Gen · Inverter · ${L('Off','Off')}</span></div>
   <div class="box"><span class="k">${L('Generator today','Gen today')}</span><span class="v">${genH.toFixed(1)}<small>h</small></span><span class="s">${L('across all buildings','for all buildings')}</span></div>
   <div class="box"><span class="k">${L('Diesel today (est.)','Diesel today (est.)')}</span><span class="v">${Math.round(dsl)}<small>L</small></span><span class="s">≈ ₦${fmt(Math.round(dsl*1250/100)*100)} ${L('at ₦1,250/L','for ₦1,250/L')}</span></div>
  </div>
  <div class="echips" role="group" aria-label="Filter buildings">${chip('all',L('All','All'),rows.length)}${chip('alerts',L('Needs attention','Need attention'),rows.filter(r=>r.al.length).length)}${chip('gen','On gen',cnt('gen'))}${chip('inv','On inverter',cnt('inv'))}${chip('off',L('No power','No light'),cnt('off'))}${chip('offline',L('Offline','Offline'),rows.filter(r=>r.s.stale).length)}</div>
  <div class="etable" role="table" aria-label="Buildings">
   <div class="erow ehead" role="row"><span role="columnheader">${L('Building','Building')}</span><span role="columnheader">${L('Power','Light')}</span><span role="columnheader">${L('Today','Today')}</span><span role="columnheader">${L('Battery','Battery')}</span><span role="columnheader">${L('Tank','Tank')}</span><span role="columnheader">${L('Gen · diesel','Gen · diesel')}</span><span role="columnheader">${L('Status','Status')}</span></div>
   ${shown.map(({b,s,al})=>`<button class="erow ${s.stale?'stale':''}" role="row" data-act="bopen" data-v="${b.id}" aria-label="${esc(b.name)}: ${s.stale?'offline':SRCLAB[s.src]}${al.length?', '+al.length+' alerts':''}">
    <span class="en" role="cell"><b>${esc(b.name)}${b.live?' <em>LIVE DEMO</em>':''}</b><small>${esc(b.area)} · ${b.units} ${L('units','flats')}</small></span>
    <span role="cell"><span class="pill src-${s.src==='inv'?'inv':s.src}"><span class="dot"></span>${SRCLAB[s.src]}${s.src==='off'?'':` · ${Math.round(s.v)} V`}</span></span>
    <span role="cell" class="etl">${s.hist.map((x,i)=>`<i class="${i>new Date().getHours()?'fut':x}"></i>`).join('')}</span>
    <span role="cell" class="enum"><span class="ebar"><i style="width:${Math.round(s.batt)}%;background:${s.batt<30?'var(--d-warn)':'var(--d-ink)'}"></i></span>${Math.round(s.batt)}%</span>
    <span role="cell" class="enum"><span class="ebar"><i style="width:${Math.round(s.tank)}%;background:${s.tank<20?'var(--d-warn)':'var(--d-blue)'}"></i></span>${Math.round(s.tank)}%</span>
    <span role="cell" class="enum ser">${s.gen.toFixed(1)} h · ${Math.round(s.gen*LPD)} L</span>
    <span role="cell" class="est-s">${al.length?al.map(a=>`<span class="ealert ${a.lvl}">${ic('alert',11,2.2)} ${a.t}</span>`).join(''):`<span class="eok">${L(`Live · ${agoTxt(s.age)} ago`,`Live · ${agoTxt(s.age)} ago`)}</span>`}</span>
   </button>`).join('')||`<p class="sub" style="padding:10px 2px">${L('No buildings match this filter.','No building match this filter.')}</p>`}
  </div>
  <div class="fcnote">${ic('clock',12)} ${L('Sample portfolio for the demo. Block C mirrors the live house in this mockup; the others are simulated.','Sample buildings for demo. Block C na the live house for this mockup; the others na simulation.')}</div>
 </section>`; }

function bldSheet(){ const b=BLD.find(x=>x.id===S.bld); if(!b) return ''; const s=bstate(b), al=alertsFor(b,s); const h=new Date().getHours();
 const hrs={nepa:0,gen:0,inv:0,off:0}; s.hist.forEach((x,i)=>{ if(i<=h) hrs[x]=(hrs[x]||0)+1; });
 return `<div class="scrim t-fade" data-act="scrim"><div class="sheet t-modal solid bsh" role="dialog" aria-label="${esc(b.name)}">
  <div class="sh"><div><h2>${esc(b.name)}</h2><div class="sub">${esc(b.area)} · ${b.units} ${L('units','flats')}</div></div><button class="xb" data-act="close" aria-label="Close">${ic('x',16)}</button></div>
  ${s.stale?`<div class="bst">${L(`<b>Not live.</b> Last reading ${agoTxt(s.age)} ago. Switching is paused for this building.`,`<b>No dey live.</b> Last reading ${agoTxt(s.age)} ago. Switch dey pause for this building.`)}</div>`:''}
  <div class="boxes" style="grid-template-columns:repeat(4,minmax(0,1fr))">
   <div class="box"><span class="k">${L('Power','Light')}</span><span class="v">${SRCLAB[s.src]}</span><span class="s">${s.src==='off'?'—':Math.round(s.v)+' V'}</span></div>
   <div class="box"><span class="k">Battery</span><span class="v">${Math.round(s.batt)}<small>%</small></span></div>
   <div class="box"><span class="k">Tank</span><span class="v">${Math.round(s.tank)}<small>%</small></span></div>
   <div class="box"><span class="k">Gen today</span><span class="v">${s.gen.toFixed(1)}<small>h</small></span><span class="s">≈ ${Math.round(s.gen*LPD)} L</span></div></div>
  <div><div class="tl">${s.hist.map((x,i)=>`<i class="${i>h?'fut':x} ${i===h?'now':''}"></i>`).join('')}</div><div class="bandlab"><span>00</span><span>06</span><span>12</span><span>18</span><span>23</span></div>
   <div class="leg" style="margin-top:6px"><span><i style="background:var(--d-ok)"></i>NEPA <b>${hrs.nepa}h</b></span><span><i style="background:var(--d-amber)"></i>Gen <b>${hrs.gen}h</b></span><span><i style="background:var(--d-blue)"></i>Inverter <b>${hrs.inv}h</b></span><span><i style="background:rgba(194,82,44,.55)"></i>Off <b>${hrs.off}h</b></span></div></div>
  ${al.length?`<div class="rows2">${al.map(a=>`<div class="r2"><span class="ealert ${a.lvl}">${ic('alert',12,2.2)}</span><span class="t"><b>${a.t}</b></span></div>`).join('')}</div>`:`<p class="sub">${L('No alerts. Everything is running normally.','No alert. Everything dey run well.')}</p>`}
  <div style="display:flex;gap:8px;flex-wrap:wrap">${b.live?`<button class="btn pri" data-act="bgo">${L('Open full dashboard','Open full dashboard')}</button>`:''}<button class="btn sec" data-act="bask" data-v="${b.id}">${ic('sparkle',14)} ${L('Ask A.D.A. about this building','Ask A.D.A. about this building')}</button></div>
 </div></div>`; }
function bldAnswer(id){ const b=BLD.find(x=>x.id===id), s=bstate(b), al=alertsFor(b,s);
 return L(`<b>${b.name}</b> ${s.stale?`is offline (last reading ${agoTxt(s.age)} ago)`:s.src==='off'?'has no power':`is on ${SRCLAB[s.src]} at ${Math.round(s.v)} V`}. Battery ${Math.round(s.batt)}%, tank ${Math.round(s.tank)}%. The generator has run ${s.gen.toFixed(1)} h today, roughly ${Math.round(s.gen*LPD)} L of diesel. ${al.length?'Needs attention: '+al.map(a=>a.t.toLowerCase()).join('; ')+'.':'Nothing needs attention.'}`,
  `<b>${b.name}</b> ${s.stale?`no dey answer (last reading ${agoTxt(s.age)} ago)`:s.src==='off'?'no get light at all':`dey on ${SRCLAB[s.src]} for ${Math.round(s.v)} V`}. Battery ${Math.round(s.batt)}%, tank ${Math.round(s.tank)}%. Gen don run ${s.gen.toFixed(1)} h today, like ${Math.round(s.gen*LPD)} L diesel. ${al.length?'Wetin need attention: '+al.map(a=>a.t.toLowerCase()).join('; ')+'.':'Nothing need attention.'}`); }
function estateAnswer(){ const rows=BLD.map(b=>({b,s:bstate(b)})); const by=k=>rows.filter(r=>!r.s.stale&&r.s.src===k).map(r=>r.b.name);
 const genH=rows.reduce((a,r)=>a+r.s.gen,0), worst=rows.filter(r=>alertsFor(r.b,r.s).length).map(r=>r.b.name);
 return L(`On gen now: <b>${by('gen').join(', ')||'none'}</b>. On inverter: ${by('inv').join(', ')||'none'}. No power: ${by('off').join(', ')||'none'}. Generators have run <b>${genH.toFixed(1)} h</b> across the estate today (about ${Math.round(genH*LPD)} L of diesel). Needs attention: ${worst.join(', ')||'nothing'}.`,
  `Na gen dey run now for: <b>${by('gen').join(', ')||'none'}</b>. Inverter: ${by('inv').join(', ')||'none'}. No light: ${by('off').join(', ')||'none'}. Gen don run <b>${genH.toFixed(1)} h</b> for the whole estate today (like ${Math.round(genH*LPD)} L diesel). Wetin need attention: ${worst.join(', ')||'nothing'}.`); }

/* ============ events ============ */
let eatClick=false;
document.addEventListener('click',e=>{
 if(eatClick){ eatClick=false; e.preventDefault(); e.stopPropagation(); return; }
 const b=e.target.closest('[data-act]');
 if(!b){ const t=e.target.closest('[data-tap]'); if(t&&!S.edit){ const w=find(t.dataset.wid);
   if(t.dataset.tap==='lock') w.locked=!w.locked; else if(t.dataset.tap==='gate') w.closed=!w.closed; else if(t.dataset.tap==='washer') w.on=!w.on; else if(t.dataset.tap==='light'){ const on=!w.lamps.some(l=>l[1]); w.lamps.forEach(l=>l[1]=on); } update(); } return; }
 const a=b.dataset.act, v=b.dataset.v, id=b.dataset.id;
 { const r=denseAct(a,v); if(r==='done') return; if(r){ update(); return; } }
 if((a==='scrim'||a==='scrimshare')&&e.target!==b) return;
 switch(a){
  case 'upload': uploadKey=v; $('#file').click(); return;
  case 'unpic': if(IMG[v]&&IMG[v].startsWith('blob:')) URL.revokeObjectURL(IMG[v]); delete IMG[v]; idbPut(v,null); break;
  case 'go': if(S.view==='dash'&&v!==S.dash&&!S.edit&&!S.sliding){ slideTo(v); return; } S.dash=v; S.view='dash'; break;
  case 'settings': S.view='settings'; S.edit=false; break;
  case 'play': S.playing=!S.playing; break;
  case 'scene': S.scene=S.scene===v?null:v; break;
  case 'tup': find(id).target=Math.min(30,find(id).target+1); break;
  case 'tdown': find(id).target=Math.max(10,find(id).target-1); break;
  case 'tmode': find(id).mode=v; break;
  case 'bl': find(id).pos=+v; break;
  case 'lamp': { const w=find(id), i=+b.dataset.i; w.lamps[i][1]=!w.lamps[i][1]; break; }
  case 'lockt': find(id).locked=!find(id).locked; break;
  case 'locks': S.sheet={kind:'locks'}; break;
  case 'close': case 'scrim': { const ms=[...document.querySelectorAll('#layer .t-modal:not([aria-label="Share"]), #layer .si')]; closeAnim(ms[ms.length-1],()=>{ S.sheet=null; S.ov=null; }); return; }
  case 'remove': { for(const k in S.boards) S.boards[k]=S.boards[k].filter(x=>x.id!==id); break; }
  case 'done': S.edit=false; S.device=null; break;
  case 'dev': S.device=v; break;
  case 'browser': S.ov='browser'; break;
  case 'btab': S.btab=v; break;
  case 'install': S.installed[v]=true; toast(`${v} installed. It’s in the widget list now.`); break;
  case 'pictures': S.ov='pictures'; break;
  case 'accounts': S.ov='accounts'; break;
  case 'setup': S.ov='setup'; S.setupDone=false; setTimeout(()=>{ if(S.ov==='setup'){ S.setupDone=true; render(); } },1900); break;
  case 'signin': S.ov='signin'; break;
  case 'peek': { const i=$('#sp'); i.type=i.type==='password'?'text':'password'; return; }
  case 'delacct': S.accounts.splice(+v,1); break;
  case 'pdark': { const p=S.people.find(x=>x.id===v); p.dark=p.dark===true?false:p.dark===false?'auto':true; if(p.id===S.me) S.look.dark=p.dark; break; }
  case 'who': { const ids=S.people.map(p=>p.id); S.accessWho=ids[(ids.indexOf(S.accessWho)+1)%ids.length]; break; }
  case 'acc': S.access[b.dataset.p][b.dataset.d]=+v; break;
  case 'share': S.share=v; S.sent=false; break;
  case 'closeshare': case 'scrimshare': closeAnim(document.querySelector('#layer .t-modal[aria-label="Share"]'),()=>{ S.share=null; }); return;
  case 'sent': S.sent=true; break;
  case 'copy': { const t=$('#link').textContent, ok=()=>{const c=$('#copied'); if(c) c.textContent='Link copied';};
    try{ navigator.clipboard.writeText(t).then(ok,()=>getSelection().selectAllChildren($('#link'))); }catch(_){ getSelection().selectAllChildren($('#link')); } return; }
  case 'studio': S.studio=!S.studio; lastStudioLook=JSON.stringify(S.look); break;
  case 'studiosave': S.studio=false; toast('Saved and in use'); break;
  case 'studiocancel': if(lastStudioLook) S.look=JSON.parse(lastStudioLook); S.studio=false; break;
  case 'stab': S.stab=v; break;
  case 'undo': if(S.hist.length){ S.fut.push(JSON.stringify(S.look)); S.look=JSON.parse(S.hist.pop()); } break;
  case 'redo': if(S.fut.length){ S.hist.push(JSON.stringify(S.look)); S.look=JSON.parse(S.fut.pop()); } break;
  case 'finetune': S.fine=!S.fine; break;
  case 'mat': lookChange(()=>{ S.look.mat=v; S.look.tune=null; }); break;
  case 'resetmat': lookChange(()=>{ S.look.tune=null; }); break;
  case 'accent': lookChange(()=>{ S.look.accent=v; }); break;
  case 'tint': lookChange(()=>{ S.look.tint=v; }); break;
  case 'corners': lookChange(()=>{ S.look.corners=v; }); break;
  case 'dark': lookChange(()=>{ S.look.dark=v==='auto'?'auto':v==='true'; }); break;
 }
 update();
});
document.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button][data-act]')){ e.preventDefault(); e.target.click(); } if(e.key==='Escape'&&S.ov!=='login'&&(S.sheet||S.ov||S.share)){ const ms=[...document.querySelectorAll('#layer .t-modal, #layer .si')]; closeAnim(ms[ms.length-1],()=>{ if(S.share) S.share=null; else { S.sheet=null; S.ov=null; } }); } });
let knobStart=null;
document.addEventListener('input',e=>{ const t=e.target;
 if(t.classList.contains('gs')) t.style.setProperty('--p',((t.value-t.min)/(t.max-t.min)*100)+'%');
 if(t.dataset.knob){ if(!knobStart){ knobStart=JSON.stringify(S.look); } if(!S.look.tune) S.look.tune=Object.assign({},MATS[S.look.mat]); S.look.tune[t.dataset.knob]=+t.value; applyLook(); }
 if(t.dataset.bright){ find(t.dataset.bright).bright=+t.value; }
 if(t.dataset.hex!==undefined){ S.look.accent=t.value; applyLook(); }
});
document.addEventListener('change',e=>{ const t=e.target;
 if(t.dataset.knob&&knobStart){ S.hist.push(knobStart); S.fut=[]; knobStart=null; update(); }
 if(t.dataset.pmain){ S.people.find(p=>p.id===t.dataset.pmain).main=t.value; update(); }
 if(t.dataset.showslots!==undefined){ S.showSlots=t.checked; update(); }
 if(t.dataset.hex!==undefined) update();
});
document.addEventListener('submit',e=>{ e.preventDefault();
 if(e.target.id==='askform'){ const q=$('#askin').value.trim(); if(q) ask(q); return; }
 if(e.target.id==='acctform'){ S.accounts.push({name:$('#an').value.trim(),pw:$('#ap').value}); update(); }
 if(e.target.id==='signform'){ const n=$('#sn').value.trim().toLowerCase(), p=$('#sp').value, a=S.accounts.find(x=>x.name.toLowerCase()===n&&x.pw===p);
  if(a){ S.ov=null; S.view='dash'; S.dash='kitchen'; S.me='ktab'; update(); toast(`Signed in as ${a.name}`); } else showError(e.target); }
});

/* hold, drag, resize, pinch */
let hold=null, drag=null; const pts=new Map(); let pinch=null;
document.addEventListener('pointerdown',e=>{
 pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(S.edit&&pts.size===2){ const tEl=e.target.closest('[data-wid]'); if(tEl){ const [a,b]=[...pts.values()]; const pw=find(tEl.dataset.wid), pz=sz(pw); pinch={el:tEl,w:pw,dv:curDev(),dx0:Math.abs(a.x-b.x),dy0:Math.abs(a.y-b.y),s0:pz.c,r0:pz.rows}; cancelDrag(); return; } }
 const g=e.target.closest('[data-grip]'), rs=e.target.closest('[data-resize]');
 if(S.edit&&(g||rs)){ e.preventDefault(); const id=g?g.dataset.grip:rs.dataset.resize, el=document.querySelector(`[data-wid="${id}"]`), r=el.getBoundingClientRect(), grid=el.parentElement;
  const cols=getComputedStyle(grid).gridTemplateColumns.split(' ').length, colW=(grid.clientWidth+12)/cols;
  const dw=find(id), dz=sz(dw); drag={mode:g?'move':'resize',id,el,x:e.clientX,y:e.clientY,colW,cols,w:dw,dv:curDev(),s0:dz.c,r0:dz.rows};
  if(g){ el.classList.add('dragging'); const gh=document.createElement('div'); gh.className='ghost'; Object.assign(gh.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'}); document.body.appendChild(gh); drag.ghost=gh; }
  return; }
 if(S.edit) return;
 const lh=e.target.closest('[data-lamphold]');
 const h=lh||e.target.closest('[data-wid],[data-hold]'); if(!h) return;
 if(!lh&&e.target.closest('button,input,select')&&!e.target.closest('[data-hold]')) return;
 hold={x:e.clientX,y:e.clientY,t:setTimeout(()=>{ eatClick=true; setTimeout(()=>eatClick=false,900);
  if(lh){ const [wid,i]=lh.dataset.lamphold.split(':'), w=find(wid); w.lamps.forEach((l,j)=>l[1]=j===+i); update(); toast(`Only ${w.lamps[+i][0]} is on`); return; }
  if(h.dataset.hold==='dock'){ if(S.view==='dash'&&DENSE_PAGES.includes(S.dash)){ toast('These panels are fixed for now. The glass dashboards can still be edited from Settings.'); return; } S.edit=true; S.view='dash'; S.device=null; update(); toast('Editing. Drag, resize or pinch widgets'); return; }
  const w=find(h.dataset.wid); S.sheet={kind:['weather','thermo','light'].includes(w.type)?w.type:'other',id:w.id}; update(); },520)};
});
document.addEventListener('pointermove',e=>{
 if(pts.has(e.pointerId)) pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(hold&&Math.hypot(e.clientX-hold.x,e.clientY-hold.y)>10){ clearTimeout(hold.t); hold=null; }
 if(pinch&&pts.size===2){ e.preventDefault(); const [a,b]=[...pts.values()], kx=Math.abs(a.x-b.x)/Math.max(30,pinch.dx0), ky=Math.abs(a.y-b.y)/Math.max(30,pinch.dy0);
  const ns=Math.max(1,Math.min(COLS[pinch.dv],Math.round(pinch.s0*kx))), nr=Math.max(1,Math.min(8,Math.round(pinch.r0*ky)));
  pinch.w.sz[pinch.dv]=[ns,nr]; setSpan(pinch.el,ns,nr); return; }
 if(!drag) return; e.preventDefault();
 if(drag.mode==='move'){ drag.ghost.style.transform=`translate(${e.clientX-drag.x}px,${e.clientY-drag.y}px)`;
  drag.ghost.style.display='none'; const u=document.elementFromPoint(e.clientX,e.clientY); drag.ghost.style.display='';
  document.querySelectorAll('.drop,.over').forEach(x=>x.classList.remove('drop','over')); drag.target=drag.dock=null;
  const t=u&&u.closest('[data-wid]'), d=u&&u.closest('[data-dock]');
  if(t&&t.dataset.wid!==drag.id){ t.classList.add('drop'); drag.target=t.dataset.wid; } else if(d&&d.dataset.dock!==S.dash){ d.classList.add('over'); drag.dock=d.dataset.dock; } }
 else { const ns=Math.max(1,Math.min(drag.cols,drag.s0+Math.round((e.clientX-drag.x)/drag.colW))), nr=Math.max(1,Math.min(8,drag.r0+Math.round((e.clientY-drag.y)/66)));
  drag.w.sz[drag.dv]=[ns,nr]; setSpan(drag.el,ns,nr); }
},{passive:false});
function cancelDrag(){ if(drag){ if(drag.ghost) drag.ghost.remove(); drag.el.classList.remove('dragging'); drag=null; } }
function endPtr(e){ pts.delete(e.pointerId); if(hold){ clearTimeout(hold.t); hold=null; }
 if(pinch&&pts.size<2){ pinch=null; update(); return; }
 if(!drag) return; const d=drag; drag=null; if(d.ghost) d.ghost.remove();
 if(d.mode==='move'){ const list=sorted(S.dash,d.dv), i=list.findIndex(x=>x.id===d.id);
  if(d.target){ const [w]=list.splice(i,1); list.splice(list.findIndex(x=>x.id===d.target),0,w); list.forEach((x,j)=>x.o[d.dv]=j); }
  else if(d.dock&&S.boards[d.dock]){ const src=S.boards[S.dash], w=src.splice(src.findIndex(x=>x.id===d.id),1)[0], dst=S.boards[d.dock]; DEVS.forEach(dv=>w.o[dv]=dst.length+1); dst.push(w); toast(`Moved to ${DASH.find(x=>x[0]===d.dock)[1]}`); } }
 update(); }
document.addEventListener('pointerup',endPtr); document.addEventListener('pointercancel',endPtr);
document.addEventListener('contextmenu',e=>{ if(e.target.closest('[data-wid],[data-hold],[data-lamphold]')) e.preventDefault(); });
document.addEventListener('touchmove',e=>{ if(drag||pinch) e.preventDefault(); },{passive:false});

let lastDev=autoDev(); addEventListener('resize',()=>{ const d=autoDev(); if(d!==lastDev){ lastDev=d; if(!drag&&!pinch) render(); } });
setInterval(()=>{ if(!drag&&!pinch&&!S.sheet&&!S.ov&&!S.share&&!S.studio){ applyLook(); render(); } },30000);
