<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>GlassHome</title>
<style>
/* GlassHome mockup. Frosted tiles over a wallpaper; 16 columns wide, 8 on tablet, 4 on phone; one round dock. */
:root{
  --ink:#0f131b; --ink2:#5a6170; --ink3:#8b919d;
  --glass-rgb:255,255,255; --green-rgb:214,240,221; --pink-rgb:250,220,218; --blue-rgb:214,231,247; --cream-rgb:255,246,226; --sky-rgb:214,234,250; --sage-rgb:224,232,226; --peach-rgb:255,232,214;
  --ta:.62; --blur:24px; --sat:170%; --bright:1.05; --contrast:1;
  --edge-rgb:255,255,255; --edge-a:.8; --edge-w:1px;
  --sheen-a:.35; --shadow-a:.12; --shadow-y:10px; --shadow-b:30px; --glow:0; --grain-a:0;
  --chip:rgba(255,255,255,.88); --chip-line:rgba(15,19,27,.07); --pill:rgba(255,255,255,.7); --pill-line:rgba(15,19,27,.06);
  --accent:#4fb3cf; --accent-rgb:79,179,207; --sel:rgba(178,222,236,.75); --sel-line:rgba(79,179,207,.55);
  --r:22px; --rs:14px;
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-d:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color-scheme:light;
}
html.dark{
  --ink:#f2f5fa; --ink2:rgba(232,238,248,.68); --ink3:rgba(232,238,248,.45);
  --glass-rgb:30,46,72; --green-rgb:34,78,58; --pink-rgb:92,40,44; --blue-rgb:28,74,120; --cream-rgb:72,62,40; --sky-rgb:34,70,108; --sage-rgb:52,72,66; --peach-rgb:90,58,40;
  --ta:.55; --edge-a:.14;
  --chip:rgba(255,255,255,.1); --chip-line:rgba(255,255,255,.14); --pill:rgba(255,255,255,.08); --pill-line:rgba(255,255,255,.12);
  --sel:rgba(79,179,207,.32); --sel-line:rgba(120,205,228,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--font);color:var(--ink);font-size:15px;-webkit-font-smoothing:antialiased;overflow-x:hidden;background:#cbbfae}
html.dark body{background:#0d1726}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;border:none;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* wallpaper */
.wall{position:fixed;inset:0;z-index:-2;background-size:cover;background-position:center;opacity:0;transition:opacity .8s}
.wall.on{opacity:1}
.wall-dim{position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,0) 30%,rgba(0,0,0,.14))}
html.dark .wall-dim{background:linear-gradient(180deg,rgba(5,12,24,.35),rgba(5,12,24,.2) 40%,rgba(5,12,24,.45))}

.app{min-height:100vh;padding:calc(12px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 112px max(12px,env(safe-area-inset-left,0px));display:flex;gap:16px;align-items:flex-start}
.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px;margin:0 auto;width:100%;transition:max-width .35s}

/* glass surface */
.g{position:relative;background:
   radial-gradient(rgba(15,19,27,var(--grain-a)) .6px, rgba(0,0,0,0) 1px) 0 0/3px 3px,
   linear-gradient(145deg, rgba(255,255,255,var(--sheen-a)), rgba(255,255,255,0) 42%),
   rgba(var(--trgb,var(--glass-rgb)),var(--ta));
  border:var(--edge-w) solid rgba(var(--edge-rgb),var(--edge-a));
  box-shadow:0 var(--shadow-y) var(--shadow-b) rgba(10,14,24,var(--shadow-a)), 0 0 calc(var(--glow)*22px) rgba(var(--glow-rgb,var(--accent-rgb)),calc(var(--glow)*.75)), inset 0 1px 0 rgba(255,255,255,calc(var(--sheen-a)*1.4));
  -webkit-backdrop-filter:blur(var(--blur)) saturate(var(--sat)) brightness(var(--bright)) contrast(var(--contrast));backdrop-filter:blur(var(--blur)) saturate(var(--sat)) brightness(var(--bright)) contrast(var(--contrast));
  border-radius:var(--r);transition:background .4s,border-radius .3s,box-shadow .4s,border-color .4s}
.tint-green{--trgb:var(--green-rgb);--glow-rgb:72,200,120}
.tint-pink{--trgb:var(--pink-rgb);--glow-rgb:240,90,80}
.tint-blue{--trgb:var(--blue-rgb);--glow-rgb:80,160,240}
.tint-cream{--trgb:var(--cream-rgb);--glow-rgb:250,190,80}
.tint-sky{--trgb:var(--sky-rgb);--glow-rgb:80,170,240}
.tint-sage{--trgb:var(--sage-rgb);--glow-rgb:120,200,160}
.tint-peach{--trgb:var(--peach-rgb);--glow-rgb:250,140,80}
/* materials with their own drawing */
html.m-neon .g:not(.solid){--trgb:16,18,30 !important;--ta:.74;color:#f4f6fb;--edge-rgb:var(--glow-rgb,var(--accent-rgb))}
html.m-neon .g:not(.solid) .lab,html.m-neon .g:not(.solid) .sub{color:rgba(240,244,252,.7)}
html.m-neon .g:not(.solid) .chip{background:rgba(var(--glow-rgb,var(--accent-rgb)),.16);border-color:rgba(var(--glow-rgb,var(--accent-rgb)),.7);color:rgb(var(--glow-rgb,var(--accent-rgb)))}
html.m-paper .g:not(.solid){-webkit-backdrop-filter:none;backdrop-filter:none}
html.m-chalk .g:not(.solid){-webkit-backdrop-filter:none;backdrop-filter:none}
html.m-chalk.dark .g:not(.solid){--trgb:38,64,54 !important;--ta:.92}
.mline{display:none;position:absolute;inset:3px;border:2.5px solid currentColor;border-radius:calc(var(--r) - 2px);pointer-events:none;filter:url(#chalk);opacity:.85}
html.m-chalk .g:not(.solid)>.mline{display:block}
html.m-chalk .g:not(.solid) .chip{background:transparent;border:2px solid currentColor;filter:url(#chalk)}

.solid{background:rgba(250,251,253,.94);border:1px solid rgba(255,255,255,.9);box-shadow:0 24px 70px rgba(10,14,24,.22);border-radius:calc(var(--r) + 6px)}
html.dark .solid{background:rgba(22,30,46,.96);border-color:rgba(255,255,255,.1)}

/* small parts */
.chip{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--chip);border:1px solid var(--chip-line);box-shadow:0 1px 3px rgba(0,0,0,.05), inset 0 1px 0 rgba(255,255,255,.5);color:var(--ink)}
.lab{font-size:11.5px;color:var(--ink2);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm{font-size:14.5px;font-weight:650;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:13px;color:var(--ink2)}
.hd{position:relative;display:flex;align-items:center;gap:10px;min-width:0;z-index:2}
.hd>div{min-width:0}
.big{position:relative;z-index:2;margin-top:auto;font-family:var(--font-d);font-size:30px;font-weight:750;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.big sup{font-size:.5em;font-weight:700;vertical-align:.85em;margin-left:1px}
.big small{font-size:.5em;font-weight:650;margin-left:2px}
.pre{position:relative;z-index:2;font-size:12px;color:var(--ink2);margin-bottom:4px}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 10px 9px 9px;border-radius:calc(var(--r) - 2px)}
.bar .t1{font-size:12px;color:var(--ink2)}
.bar .t2{font-size:16px;font-weight:700}
.lockbadge{height:38px;padding:0 12px;border-radius:12px;display:flex;align-items:center;gap:6px;font-weight:700;background:var(--chip);border:1px solid var(--chip-line);color:#d6453f}
.lockbadge.ok{color:var(--ink2)}

/* grid */
.grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));grid-auto-rows:54px;grid-auto-flow:row dense;gap:12px;position:relative}
.grid.d-monitor{gap:14px}
.tile{grid-column:span var(--c);grid-row:span var(--rows)}

.tile{min-width:0;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.ti{position:absolute;inset:0;overflow:hidden;border-radius:inherit;padding:12px 14px;display:flex;flex-direction:column}
.tile.photo{color:#fff}
.tile.photo .lab{color:rgba(255,255,255,.85)}
.tile.photo .chip{background:rgba(20,24,32,.35);border-color:rgba(255,255,255,.22);color:#fff;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.tile.photo .hd,.tile.photo .big{text-shadow:0 1px 10px rgba(0,0,0,.35)}
.shade{position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.28),rgba(0,0,0,0) 34%,rgba(0,0,0,0) 58%,rgba(0,0,0,.42))}

/* image slots */
.slot{position:absolute;background-size:cover;background-position:center;background-repeat:no-repeat}
.slot.fill{inset:0;z-index:0}
.slot.prod{right:6px;bottom:4px;width:46%;height:72%;background-size:contain;background-position:right bottom;z-index:1}
.slot.prod svg{position:absolute;right:4px;bottom:4px;opacity:.9}
.slot.prod.has svg{display:none}
.ph-sky{background-color:#7f9fb8;background-image:linear-gradient(180deg,#6f93b4 0%,#a9c2d6 45%,#8aa0a0 60%,#3f6670 100%)}
.ph-room{background-color:#bfae98;background-image:linear-gradient(180deg,#e8ddcf,#cbb79e 70%,#a99178)}
.ph-cam{background-color:#6d7a7f;background-image:linear-gradient(180deg,#9fb4c4,#c9d2d4 48%,#8a8574 50%,#5e5a4f)}
.ph-art{background-color:#5b3d34;background-image:radial-gradient(circle at 35% 35%,#e3a35c,#7a3f2d 45%,#2a1b22 80%)}
.up{position:absolute;z-index:6;left:50%;top:50%;transform:translate(-50%,-50%);height:30px;padding:0 11px;border-radius:999px;background:rgba(15,19,27,.78);color:#fff;font-size:12px;font-weight:650;display:flex;align-items:center;gap:6px;white-space:nowrap;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.slot.fill .up{top:calc(50% + 42px)}
.slot.prod .up{left:auto;right:6px;top:auto;bottom:6px;transform:none}

/* weather */
.wx{position:relative;z-index:2;display:flex;flex-direction:column;height:100%}
.wx .t{font-family:var(--font-d);font-size:clamp(64px,7.4vw,104px);font-weight:800;line-height:.86;letter-spacing:-.05em}
.wx .t span{font-size:.42em;vertical-align:1.15em;margin-left:2px;font-weight:700}
.wx .cond{font-size:15px;font-weight:650;margin-top:8px}
.wx-bot{margin-top:auto;display:flex;align-items:flex-end;gap:22px;min-width:0}
.curve{flex:1;min-width:0}
.curve svg{display:block;width:100%;height:auto;overflow:visible}
.days{display:flex;gap:16px;flex:none}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;font-weight:700}
.day .rain{font-size:11px;color:#8fd0ff;height:13px;font-weight:700}
.day .bar2{width:5px;height:40px;border-radius:3px;background:linear-gradient(#45dd8a,#2db8a2)}
.day .lo{font-weight:600;opacity:.85}
.wx.small .days{display:none}
.wx.tiny .wx-bot{display:none}
.wx.tiny .t{font-size:64px}
.compact .disc{width:64px;right:14px}
.compact .hd .chip{width:40px!important;height:40px!important}

/* media */
.mbg{position:absolute;inset:-30px;z-index:0;background-size:cover;background-position:center;filter:blur(30px) saturate(140%);opacity:.75}
.disc{position:absolute;z-index:1;right:16px;top:50%;transform:translateY(-55%);width:clamp(70px,30%,150px);aspect-ratio:1;border-radius:50%;background-size:cover;background-position:center;border:5px solid #121418;box-shadow:0 10px 30px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.08)}
.disc::after{content:"";position:absolute;inset:42%;border-radius:50%;background:#121418;box-shadow:0 0 0 2px rgba(255,255,255,.1)}
.playing .disc{animation:spin 8s linear infinite}
@keyframes spin{to{transform:translateY(-55%) rotate(360deg)}}
.mctl{position:relative;z-index:2;margin-top:auto;display:flex;align-items:center;gap:10px}
.seg3{display:inline-flex;border-radius:12px;overflow:hidden;background:rgba(20,24,32,.35);border:1px solid rgba(255,255,255,.18);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.seg3 button{width:42px;height:36px;display:grid;place-items:center;color:#fff}
.seg3 button+button{border-left:1px solid rgba(255,255,255,.14)}
.vol{font-size:12px;font-weight:600;color:rgba(255,255,255,.85);display:flex;align-items:center;gap:5px}

/* room card chips */
.rchips{position:relative;z-index:2;margin-top:auto;display:flex;gap:6px;overflow:hidden}
.rc{flex:none;height:32px;padding:0 10px;border-radius:10px;display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:650;color:#fff;background:rgba(18,22,30,.42);border:1px solid rgba(255,255,255,.16);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.rc .ico{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;background:rgba(255,255,255,.12)}
.rc.warm .ico{background:#c8652f}
.rc.green .ico{background:#2f9c6a}

/* scenes */
.scn{position:relative;z-index:2;margin-top:auto;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.scn::-webkit-scrollbar{display:none}
.sb{flex:none;height:32px;padding:0 12px;border-radius:10px;display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:650;background:var(--pill);border:1px solid var(--pill-line)}
.sb.on{background:var(--ink);color:rgb(var(--glass-rgb))}
html.dark .sb.on{color:#0f131b}
.spark{position:absolute;right:0;bottom:0;width:62%;height:62%;z-index:1}

/* small tile controls */
.tc{position:absolute;right:10px;bottom:10px;z-index:3;display:flex;gap:6px}
.tc button,.seg2 button{height:32px;min-width:34px;padding:0 8px;border-radius:10px;display:grid;place-items:center;background:var(--pill);border:1px solid var(--pill-line);font-weight:700}
.seg2{display:inline-flex}
.seg2 button{border-radius:0}
.seg2 button:first-child{border-radius:10px 0 0 10px}.seg2 button:last-child{border-radius:0 10px 10px 0;border-left:none}
.tc .on{background:rgba(var(--glow-rgb,var(--accent-rgb)),.18);border-color:rgba(var(--glow-rgb,var(--accent-rgb)),.6);color:rgb(var(--glow-rgb,var(--accent-rgb)))}

/* clock */
.clock{position:relative;z-index:2;margin:auto 0;text-align:center}
.clock .tm{font-family:var(--font-d);font-size:clamp(40px,5.5vw,76px);font-weight:300;letter-spacing:.01em;font-variant-numeric:tabular-nums;line-height:1}
.live{position:relative;z-index:2;margin-left:auto;height:24px;padding:0 9px;border-radius:999px;background:#2fae6c;color:#fff;font-size:11.5px;font-weight:700;display:flex;align-items:center}

/* edit mode */
.editing .tile{animation:wob .9s ease-in-out infinite alternate}
@keyframes wob{from{transform:rotate(-.3deg)}to{transform:rotate(.3deg)}}
@media (prefers-reduced-motion:reduce){.editing .tile{animation:none}*{transition:none!important}}
.editing .grid::before{content:"";position:absolute;inset:-14px;border-radius:calc(var(--r) + 8px);box-shadow:0 0 0 2px rgba(110,190,230,.75),0 0 28px 4px rgba(90,170,230,.45);pointer-events:none}
.tile .eh{position:absolute;z-index:8;display:grid;place-items:center;border-radius:50%;background:rgba(15,19,27,.86);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.18)}
.tile .eh.x{top:-9px;left:-9px;width:26px;height:26px}
.tile .eh.grip{left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;cursor:grab;touch-action:none}
.tile .eh.rs{right:-9px;bottom:-9px;width:26px;height:26px;cursor:nwse-resize;touch-action:none}
.tile.drop{box-shadow:0 0 0 3px var(--accent)}
.tile.dragging{opacity:.3}
.ghost{position:fixed;z-index:100;pointer-events:none;border-radius:var(--r);background:rgba(var(--accent-rgb),.22);border:2px solid var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:90;padding:9px 15px;border-radius:999px;background:rgba(15,19,27,.86);color:#fff;font-size:13px;font-weight:600;white-space:nowrap;pointer-events:none}

/* dock */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:2px;padding:6px;border-radius:24px;max-width:calc(100vw - 16px);overflow-x:auto;scrollbar-width:none}
.dock::-webkit-scrollbar{display:none}
.dock .db{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--ink);transition:background .2s,box-shadow .2s}
.dock .db[aria-current=page]{background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.65),rgba(255,255,255,0) 60%),linear-gradient(rgba(130,200,225,.9),rgba(70,160,200,.85));color:#0f2c3a;box-shadow:0 2px 8px rgba(40,120,160,.35),inset 0 0 0 1px rgba(255,255,255,.5)}
.dock .db.over{background:var(--accent);color:#fff}
.dock .sep{flex:none;width:1px;height:28px;background:var(--pill-line);margin:0 6px}
.devs{flex:none;display:flex;gap:2px;padding:3px;border-radius:13px;background:var(--pill);border:1px solid var(--pill-line)}
.devs button{width:36px;height:34px;border-radius:10px;display:grid;place-items:center}
.devs button[aria-pressed=true]{background:rgba(var(--glass-rgb),.95);box-shadow:0 1px 4px rgba(0,0,0,.14)}
html.dark .devs button[aria-pressed=true]{background:rgba(255,255,255,.18)}
.addw{flex:none;margin-left:6px;height:40px;padding:0 14px;border-radius:13px;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:650;white-space:nowrap;background:rgba(var(--accent-rgb),.2);border:1px solid rgba(var(--accent-rgb),.55)}
.okb{flex:none;margin-left:4px;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--ink);color:rgb(var(--glass-rgb))}
html.dark .okb{color:#0f131b}
@media (max-width:460px){.dock .db{width:40px;height:42px}}

/* overlays */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(10,14,24,.3);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:center;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
@media (min-width:720px){.scrim{align-items:center}}
.sheet{width:min(560px,100%);max-height:88vh;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.sheet.wide{width:min(1000px,100%)}
.sheet>*{flex-shrink:0}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sh h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.xb{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--pill);border:1px solid var(--pill-line)}
.sec{font-size:13px;font-weight:600;color:var(--ink2);margin:2px 0 -4px}

/* hold sheets */
.sheet.wxs{background:rgba(24,28,36,.94);color:#f2f5fa;border-color:rgba(255,255,255,.1)}
.sheet.wxs .sec{color:rgba(240,244,250,.7)}
.sheet.wxs .xb{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.12)}
.wxhead{position:relative;margin:-18px -18px 0;height:150px;border-radius:calc(var(--r) + 6px) calc(var(--r) + 6px) 0 0;overflow:hidden;display:flex;align-items:flex-end;padding:16px 18px}
.wxhead .slot{inset:0;z-index:0}
.wxhead .slot:not(.has){background-color:#6f93b4;background-image:linear-gradient(180deg,#6f93b4 0%,#a9c2d6 45%,#8aa0a0 60%,#3f6670 100%)}
.wxhead::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(24,28,36,0) 45%,rgba(24,28,36,.92))}
.wxhead>div{position:relative;z-index:2;display:flex;align-items:center;gap:12px}
.hours{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-radius:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
.hours>div{display:flex;align-items:center;gap:10px;padding:12px}
.hours>div:nth-child(3n+2),.hours>div:nth-child(3n+3){border-left:1px solid rgba(255,255,255,.08)}
.hours>div:nth-child(n+4){border-top:1px solid rgba(255,255,255,.08)}
.hours b{display:block;font-size:15px}
.hours span{font-size:12px;opacity:.75}
.dlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.dlist>div{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
.dlist .ic2{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08)}
.dlist .ic2.sun{background:rgba(240,160,60,.35)}
.dlist b{display:block;font-size:14px}.dlist span{font-size:12px;opacity:.75}
.sheet.pink{background:rgba(252,232,230,.96)}
html.dark .sheet.pink{background:rgba(70,34,38,.96)}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:6px;border-radius:18px;background:rgba(255,255,255,.55);border:1px solid rgba(15,19,27,.05)}
html.dark .modes{background:rgba(255,255,255,.06)}
.modes button:nth-child(4){grid-column:1/-1;justify-self:center;width:calc(33.3% - 3px)}
.modes button{height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;gap:7px;font-weight:600}
.modes button[aria-pressed=true]{background:linear-gradient(rgba(255,255,255,.9),rgba(250,214,212,.95));box-shadow:0 2px 8px rgba(200,60,60,.18),inset 0 0 0 1.5px #e0605a;color:#7a1f1b}
html.dark .modes button[aria-pressed=true]{background:rgba(224,96,90,.25);color:#ffd1cd}
.lamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.lamp{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.7);border:1px solid rgba(15,19,27,.06);text-align:left;touch-action:manipulation}
html.dark .lamp{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.1)}
.lamp .bulb{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#f3ecdf;color:#6b5a3a}
.lamp[aria-pressed=true] .bulb{background:#ffe2a0;box-shadow:0 0 14px rgba(255,190,80,.75)}
.lamp b{display:block;font-size:14px}.lamp span{font-size:12px;color:var(--ink2)}

/* sliders */
input.gs{-webkit-appearance:none;appearance:none;width:100%;height:30px;border-radius:999px;margin:0;
 background:linear-gradient(90deg,#8fd3e6,#55b6d3) 0 0/var(--p,50%) 100% no-repeat,rgba(15,19,27,.08);box-shadow:inset 0 1px 2px rgba(0,0,0,.08);outline-offset:3px}
html.dark input.gs{background:linear-gradient(90deg,#5fb9d4,#3c9cbd) 0 0/var(--p,50%) 100% no-repeat,rgba(255,255,255,.1)}
input.gs::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25),0 0 0 1px rgba(0,0,0,.04)}
input.gs::-moz-range-thumb{width:30px;height:30px;border:none;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25)}
input.gs::-moz-range-track{background:transparent}
.srow{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:14px;font-size:13.5px}

/* pages */
.page{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr));gap:14px;align-items:stretch}
.card{border-radius:28px;padding:24px;display:flex;flex-direction:column;gap:14px;min-width:0;overflow:hidden;position:relative}
.card h2{margin:0;font-family:var(--font-d);font-size:clamp(28px,3.2vw,38px);font-weight:800;letter-spacing:-.03em;line-height:1.04}
.card p{margin:0;font-size:clamp(16px,1.6vw,19px);line-height:1.32;color:var(--ink2)}
.prow{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:18px;background:rgba(255,255,255,.82);border:1px solid rgba(15,19,27,.05);box-shadow:0 1px 3px rgba(0,0,0,.04)}
html.dark .prow{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.1)}
.av{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:linear-gradient(#e8f1f8,#c8dbea);color:#365069;box-shadow:inset 0 0 0 1px rgba(255,255,255,.7)}
.prow .pn{font-weight:700;font-size:16px;min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .dash{display:flex;align-items:center;gap:8px;min-width:0;flex:1.3}
.prow .dash .thumb{flex:none;width:52px;height:32px;border-radius:8px;background-size:cover;background-position:center;background-color:#c9bfb2;border:1px solid rgba(15,19,27,.08)}
.prow select{min-width:0;flex:1;border:none;background:transparent;color:var(--ink2);font-size:14px;-webkit-appearance:none;appearance:none;padding:4px 0;text-overflow:ellipsis}
.mb{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(15,19,27,.05);border:1px solid rgba(15,19,27,.06)}
html.dark .mb{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.1)}
.who{align-self:flex-end;display:flex;align-items:center;gap:8px;height:38px;padding:0 14px 0 6px;border-radius:999px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.08);font-weight:700;color:#0f131b}
.who .av{width:26px;height:26px;font-size:11px}
.arow{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13.5px}
.tri{display:flex;gap:2px;padding:3px;border-radius:999px;background:rgba(255,255,255,.6);border:1px solid rgba(15,19,27,.05);box-shadow:inset 0 1px 2px rgba(0,0,0,.04)}
html.dark .tri{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.1)}
.tri button{min-width:54px;height:32px;padding:0 10px;border-radius:999px;font-size:13px;color:var(--ink2)}
.tri button[aria-pressed=true]{background:linear-gradient(rgba(214,238,246,.95),rgba(178,220,236,.95));color:#123848;box-shadow:inset 0 0 0 1px rgba(79,179,207,.6),0 1px 3px rgba(40,120,160,.2)}
html.dark .tri button[aria-pressed=true]{background:rgba(79,179,207,.3);color:#e6f6fb}
.wallcard{min-height:420px;justify-content:flex-end;color:#fff;cursor:pointer;text-align:left}
.wallcard .slot{z-index:0}
.wallcard .over{position:relative;z-index:2;display:flex;flex-direction:column;gap:8px;text-shadow:0 1px 14px rgba(0,0,0,.45)}
.wallcard p{color:rgba(255,255,255,.9)}
.wallcard .grad{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.55))}
.wallcard .tab{position:absolute;z-index:2;left:8%;top:8%;width:46%;aspect-ratio:1.45;border-radius:14px;background:#0e141d;border:5px solid #1b1f26;box-shadow:0 20px 50px rgba(0,0,0,.5);overflow:hidden;padding:9px;display:flex;flex-direction:column;gap:5px;color:#fff;text-shadow:none}
.wallcard .tab b{font-size:clamp(12px,1.8vw,20px);line-height:1}
.wallcard .tab i{display:block;height:9%;border-radius:4px;background:rgba(255,255,255,.12);width:46%}
.radar{position:relative;flex:1;min-height:220px;display:grid;place-items:center;overflow:hidden}
.radar i{position:absolute;border-radius:50%;border:1.5px solid rgba(79,179,207,.35);animation:ping 3.2s ease-out infinite}
.radar i:nth-child(2){animation-delay:1.06s}.radar i:nth-child(3){animation-delay:2.13s}
@keyframes ping{from{width:110px;height:110px;opacity:1}to{width:380px;height:380px;opacity:0}}
.radar .ring{position:absolute;width:150px;height:150px;border-radius:50%;background:radial-gradient(rgba(255,255,255,.5),rgba(255,255,255,0) 70%)}
.hub{position:relative;width:104px;height:104px;border-radius:28px;background:linear-gradient(#ffffff,#eef2f6);box-shadow:0 14px 34px rgba(0,0,0,.16),inset 0 1px 0 #fff;display:grid;place-items:center}
.hub .ok{position:absolute;top:-10px;right:-10px;width:34px;height:34px;border-radius:50%;background:#1f9d63;color:#fff;display:grid;place-items:center;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.btn{height:48px;padding:0 20px;border-radius:999px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:linear-gradient(rgba(160,212,230,.95),rgba(110,180,208,.95));color:#0f2c3a;box-shadow:0 6px 16px rgba(60,140,180,.25),inset 0 1px 0 rgba(255,255,255,.6),inset 0 0 0 1px rgba(60,140,180,.35)}
.btn.sec{background:var(--pill);border:1px solid var(--pill-line)}
.field2{height:46px;border-radius:14px;border:1px solid var(--pill-line);padding:0 14px;background:var(--pill);min-width:0;flex:1}

/* sign in */
.si{position:fixed;inset:0;z-index:80;background:#0b111a;color:#fff;display:flex;align-items:center;justify-content:center;padding:28px}
.si .slot{z-index:0;opacity:.45}
.si .veil{position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(8,12,20,.92) 0%,rgba(8,12,20,.6) 55%,rgba(8,12,20,.35))}
.si .box{position:relative;z-index:2;width:min(1040px,100%);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:center}
@media (max-width:719px){.si .box{grid-template-columns:1fr}.si .logo{display:none}}
.si .brand{position:absolute;top:calc(20px + env(safe-area-inset-top,0px));left:24px;z-index:2;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.si .brand b{color:#7cc9e6}
.si h2{margin:0 0 10px;font-family:var(--font-d);font-size:clamp(44px,6vw,64px);font-weight:800;letter-spacing:-.035em;line-height:.98}
.sif{display:flex;flex-direction:column;gap:3px;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13)}
.sif label{font-size:11.5px;color:rgba(255,255,255,.6)}
.sif div{display:flex;align-items:center;gap:8px}
.sif input{flex:1;min-width:0;background:none;border:none;color:#fff;font-size:16px;outline:none}
.sigo{height:58px;border-radius:16px;display:flex;align-items:center;gap:12px;padding:0 16px;background:linear-gradient(rgba(60,150,180,.9),rgba(30,100,130,.9));color:#fff;text-align:left;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.sigo .gi{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.18)}
.si .logo{position:relative;aspect-ratio:1;max-width:340px;justify-self:center;width:100%}
.si .logo .slot{opacity:1;inset:0;background-size:contain}
.err{min-height:18px;font-size:14px;color:#ffb6aa}

/* browser */
.bwr .ttl{font-family:var(--font-d);font-size:clamp(34px,4.6vw,56px);font-weight:800;letter-spacing:-.035em;line-height:1}
.bwr .lead{font-size:clamp(16px,1.8vw,21px);color:var(--ink2);line-height:1.3;max-width:520px}
.segbig{align-self:flex-start;display:flex;flex-direction:column;gap:8px}
.segbig .row{display:flex;gap:10px;padding:10px;border-radius:999px;background:rgba(255,255,255,.75);border:1px solid rgba(15,19,27,.06);box-shadow:inset 0 1px 3px rgba(0,0,0,.05),0 6px 20px rgba(0,0,0,.05)}
html.dark .segbig .row{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.1)}
.segbig button{width:78px;height:78px;border-radius:50%;display:grid;place-items:center}
.segbig button[aria-pressed=true]{background:radial-gradient(circle at 50% 28%,rgba(255,255,255,.95),rgba(255,255,255,0) 58%),linear-gradient(rgba(190,228,240,1),rgba(140,200,222,1));box-shadow:0 4px 14px rgba(60,140,180,.3),inset 0 0 0 1.5px rgba(79,179,207,.7)}
.segbig .labs{display:flex;gap:10px;padding:0 10px}
.segbig .labs span{width:78px;text-align:center;font-size:14px;font-weight:650}
.item{display:flex;gap:16px;padding:16px 18px;border-radius:18px;background:rgba(255,255,255,.72);border:1px solid rgba(15,19,27,.07);align-items:flex-start;box-shadow:0 1px 3px rgba(0,0,0,.03)}
html.dark .item{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.1)}
.item .ic{flex:none;width:54px;height:54px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(#ecf6fa,#d3eaf3);border:1.5px solid rgba(79,179,207,.6);color:#1f5468;box-shadow:inset 0 1px 0 #fff}
.item .bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.item .tt{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-weight:750;font-size:17px}
.item .by{font-weight:500;font-size:14px;color:var(--ink2)}
.item .meta{display:flex;gap:16px;font-size:13px;color:var(--ink2);flex-wrap:wrap;align-items:center}
.item .meta span{display:flex;align-items:center;gap:5px}
.vf{color:#2b8fd8;display:inline-grid}
.ob{padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;background:rgba(178,222,236,.6);border:1px solid rgba(79,179,207,.6);color:#1d5a70}
html.dark .ob{color:#bfe9f6;background:rgba(79,179,207,.2)}
.cb{padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;border:1px solid var(--pill-line);color:var(--ink2)}
.inst{flex:none;height:36px;padding:0 15px;border-radius:999px;font-size:13px;font-weight:700;background:rgba(var(--accent-rgb),.18);border:1px solid rgba(var(--accent-rgb),.5)}
.inst.done{background:transparent;border-color:var(--pill-line);color:var(--ink2)}
.wire{border-radius:18px;background:#fff;border:1px solid rgba(15,19,27,.12);padding:10px;display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 22px rgba(0,0,0,.08);color:#0f131b}
.wire .gg{display:grid;grid-template-columns:repeat(8,1fr);grid-auto-rows:10px;gap:4px;padding:8px;border:1px solid rgba(15,19,27,.1);border-radius:10px}
.wire .gg i{border:1px solid rgba(15,19,27,.18);border-radius:3px}
.wire .bar0{height:8px;border:1px solid rgba(15,19,27,.12);border-radius:3px}

/* materials */
.mats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
.mc{display:flex;flex-direction:column;gap:8px;align-items:flex-start;text-align:left}
.mp{display:block;position:relative;width:100%;aspect-ratio:1.12;border-radius:22px;overflow:hidden;background-size:cover;background-position:center;background-color:#8aa4b8;box-shadow:0 6px 16px rgba(0,0,0,.12)}
.mp .m{position:absolute;inset:12% 8% 8% 12%;border-radius:16px;padding:10px;display:flex;flex-direction:column;justify-content:space-between}
.mp .li{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:rgba(244,236,222,.92);color:#6b5a3a;border:1px solid rgba(0,0,0,.06)}
.mp .br{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:650}
.tg{width:38px;height:22px;border-radius:999px;background:#4fb3cf;position:relative;box-shadow:inset 0 1px 2px rgba(0,0,0,.15)}
.tg::after{content:"";position:absolute;right:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.mc[aria-pressed=true] .mp{box-shadow:0 0 0 3px var(--accent),0 6px 16px rgba(0,0,0,.12)}
.mc .nmm{font-size:14px;font-weight:650;display:flex;align-items:center;gap:6px}

/* share */
.shareprev{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:1.55;background:#b9c9d6;display:grid;place-items:center;box-shadow:0 12px 30px rgba(0,0,0,.15);transform:perspective(900px) rotateY(-8deg) rotateX(3deg)}
.linkrow{display:flex;align-items:center;gap:10px;padding:13px 16px;border-radius:16px;background:var(--pill);border:1px solid var(--pill-line);font-size:13.5px}
.linkrow code{flex:1;min-width:0;word-break:break-all;font-family:ui-monospace,Menlo,monospace;user-select:all}

/* studio */
.studio{flex:none;width:380px;position:sticky;top:12px;max-height:calc(100vh - 128px);overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px;border-radius:26px}
.st-h{display:flex;align-items:center;gap:8px}
.st-h b{display:flex;align-items:center;gap:6px;font-size:16px;margin-right:auto}
.st-h .ib{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--ink2)}
.st-h .ib:disabled{opacity:.35}
.dn{display:flex;gap:2px;padding:3px;border-radius:999px;background:var(--pill);border:1px solid var(--pill-line)}
.dn button{width:40px;height:32px;border-radius:999px;display:grid;place-items:center}
.dn button[aria-pressed=true]{background:linear-gradient(rgba(214,238,246,.95),rgba(178,220,236,.95));color:#123848;box-shadow:inset 0 0 0 1px rgba(79,179,207,.6)}
.stabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:5px;border-radius:20px;background:var(--pill);border:1px solid var(--pill-line)}
.stabs button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 0;border-radius:15px;font-size:12.5px;font-weight:600}
.stabs button[aria-pressed=true]{background:linear-gradient(rgba(214,238,246,.95),rgba(178,220,236,.95));color:#123848;box-shadow:inset 0 0 0 1.5px rgba(79,179,207,.6)}
.acc{display:flex;flex-wrap:wrap;gap:9px}
.acc button{width:36px;height:36px;border-radius:50%;box-shadow:inset 0 0 0 3px rgba(255,255,255,.85),0 1px 4px rgba(0,0,0,.15)}
.acc button[aria-pressed=true]{box-shadow:inset 0 0 0 3px rgba(255,255,255,.95),0 0 0 2.5px var(--ink)}
.o4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.o4 button{display:flex;flex-direction:column;align-items:center;gap:7px;padding:9px 4px;border-radius:16px;font-size:12.5px;font-weight:600;background:var(--pill);border:1px solid var(--pill-line)}
.o4 button[aria-pressed=true]{box-shadow:inset 0 0 0 2px var(--accent);background:rgba(var(--accent-rgb),.08)}
.mini{width:50px;height:32px;border:1px solid rgba(15,19,27,.12);display:flex;flex-direction:column;justify-content:center;gap:4px;padding:0 8px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.mini i{display:block;height:3px;border-radius:2px;background:rgba(15,19,27,.4)}
.mini i+i{width:60%;background:rgba(15,19,27,.2)}
.bgs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bgs>div{display:flex;flex-direction:column;gap:6px}
.bgs .pv{position:relative;aspect-ratio:1.5;border-radius:16px;overflow:hidden;background:#c4b8a8}
.bgs .pv .slot{inset:0}
.bgs .lbl{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:650}
.st-f{display:flex;gap:8px;margin-top:4px;position:sticky;bottom:-16px;padding:10px 0 4px;background:inherit}
@media (max-width:899px){.studio{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;max-height:64vh;z-index:55;border-radius:26px 26px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}}

/* pictures */
.pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pic{display:flex;flex-direction:column;gap:6px}
.pic .pv{position:relative;aspect-ratio:1.35;border-radius:14px;overflow:hidden;background:repeating-linear-gradient(45deg,rgba(15,19,27,.05) 0 8px,rgba(15,19,27,.02) 8px 16px);border:1px dashed rgba(15,19,27,.2)}
html.dark .pic .pv{background:repeating-linear-gradient(45deg,rgba(255,255,255,.06) 0 8px,rgba(255,255,255,.02) 8px 16px);border-color:rgba(255,255,255,.2)}
.pic .pv.has{border-style:solid}
.pic .pv .slot{inset:0}
.pic .pv .slot.contain{background-size:contain}
.pic b{font-size:13.5px}
.pic span{font-size:12px;color:var(--ink2)}
.pic .act{display:flex;gap:6px}
.pic .act button{flex:1;height:34px;border-radius:10px;font-size:13px;font-weight:650;background:var(--pill);border:1px solid var(--pill-line)}
.pic .act button.u{background:rgba(var(--accent-rgb),.18);border-color:rgba(var(--accent-rgb),.5)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ===== Dense panels: Nigerian home, power first ===== */
body.dense{--d-bg:#ece5d9;--d-pn:250,246,239;--d-ink:#2b261f;--d-ink2:#857b6c;--d-ink3:#b2a796;--d-line:rgba(43,38,31,.09);--d-box:rgba(43,38,31,.045);
 --d-amber:#b5822a;--d-amber-rgb:181,130,42;--d-ok:#3d8a57;--d-warn:#c2522c;--d-blue:#3f74a8;--d-grey:#b9b0a2;--serif:ui-serif,"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif}
html.dark body.dense{--d-bg:#17130f;--d-pn:36,31,26;--d-ink:#efe7da;--d-ink2:#9b9182;--d-ink3:#6d6458;--d-line:rgba(239,231,218,.08);--d-box:rgba(239,231,218,.04);

/* ===== transitions-dev (github.com/Jakubantalik/transitions-dev, MIT) ===== */
:root {
  /* Card resize */
  --resize-dur: 300ms;
  --resize-ease: cubic-bezier(0.22, 1, 0.36, 1);
  /* Number pop-in */
  --digit-dur: 500ms;
  --digit-distance: 8px;
  --digit-stagger: 70ms;
  --digit-blur: 2px;
  --digit-ease: cubic-bezier(0.34, 1.45, 0.64, 1);
  --digit-dir-x: 0;
  --digit-dir-y: 1;
  /* Notification badge */
  --badge-slide-dur: 260ms;
  --badge-pop-dur: 500ms;
  --badge-pop-close-dur: 180ms;
  --badge-fade-dur: 400ms;
  --badge-fade-close-dur: 180ms;
  --badge-blur: 2px;
  --badge-offset-x: -8.2px;
  --badge-offset-y: 12.4px;
  --badge-slide-ease: cubic-bezier(0.22, 1, 0.36, 1);
  --badge-pop-ease: cubic-bezier(0.34, 1.36, 0.64, 1);
  --badge-close-ease: cubic-bezier(0.4, 0, 0.2, 1);
  /* Text states swap */
  --text-swap-dur: 200ms;
  --text-swap-translate-y: 8px;
  --text-swap-blur: 2px;
  --text-swap-ease: ease-out;
  /* Menu dropdown */
  --dropdown-open-dur: 250ms;
  --dropdown-close-dur: 150ms;
  --dropdown-pre-scale: 0.97;
  --dropdown-closing-scale: 0.99;
  --dropdown-ease: cubic-bezier(0.22, 1, 0.36, 1);
  /* Modal open / close */
  --modal-open-dur: 250ms;
  --modal-close-dur: 150ms;
  --modal-scale: 0.96;
  --modal-scale-close: 0.96;
  --modal-ease: cubic-bezier(0.22, 1, 0.36, 1);
  /* Panel reveal */
  --panel-open-dur: 400ms;
  --panel-close-dur: 350ms;
  --panel-translate-y: 100px;
  --panel-blur: 2px;
  --panel-ease: cubic-bezier(0.22, 1, 0.36, 1);
  /* Page side-by-side */
  --page-slide-dur: 200ms;
  --page-fade-dur: 200ms;
  --page-slide-distance: 8px;
  --page-blur: 3px;
  --page-stagger: 0ms;
  --page-exit-enabled: 1;
  --page-slide-ease: cubic-bezier(0.22, 1, 0.36, 1);
  --page-fade-ease: cubic-bezier(0.22, 1, 0.36, 1);
  /* Icon swap */
  --icon-swap-dur: 200ms;
  --icon-swap-blur: 2px;
  --icon-swap-start-scale: 0.25;
  --icon-swap-ease: ease-in-out;
  /* Success check */
  --check-opacity-dur: 550ms;
  --check-rotate-dur: 550ms;
  --check-rotate-from: 80deg;
  --check-bob-dur: 450ms;
  --check-y-amount: 40px;
  --check-blur-dur: 500ms;
  --check-blur-from: 10px;
  --check-path-dur: 550ms;
  --check-path-delay: 80ms;
  --check-ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --check-ease-opacity: cubic-bezier(0.22, 1, 0.36, 1);
  --check-ease-rotate: cubic-bezier(0.22, 1, 0.36, 1);
  --check-ease-bob: cubic-bezier(0.34, 1.35, 0.64, 1);
  --check-ease-path: cubic-bezier(0.22, 1, 0.36, 1);
  /* Avatar group hover */
  --avatar-lift: -4px;
  --avatar-dur: 320ms;
  --avatar-scale: 1.05;
  --avatar-falloff: 0.45;
  --avatar-ease-in: cubic-bezier(0.22, 1, 0.36, 1);
  --avatar-ease-out: cubic-bezier(0.34, 3.85, 0.64, 1);
  /* Error state shake */
  --shake-distance: 6px;
  --shake-overshoot: 4px;
  --shake-dur-a: 80ms;
  --shake-dur-b: 60ms;
  --shake-ease: cubic-bezier(0.22, 1, 0.36, 1);
  --revert-hold: 3000ms;
  --revert-dur: 280ms;
}
.t-modal {
  transform-origin: center;
  transform: scale(var(--modal-scale));
  opacity: 0;
  pointer-events: none;
  transition:
    transform var(--modal-open-dur) var(--modal-ease),
    opacity   var(--modal-open-dur) var(--modal-ease);
  will-change: transform, opacity;
}
.t-modal.is-open {
  transform: scale(1);
  opacity: 1;
  pointer-events: auto;
}
.t-modal.is-closing {
  transform: scale(var(--modal-scale-close));
  opacity: 0;
  pointer-events: none;
  transition:
    transform var(--modal-close-dur) var(--modal-ease),
    opacity   var(--modal-close-dur) var(--modal-ease);
}

@media (prefers-reduced-motion: reduce) {
  .t-modal { transition: none !important; }
}
@keyframes t-digit-pop-in {
  0%   {
    transform: translate(
      calc(var(--digit-distance) * var(--digit-dir-x)),
      calc(var(--digit-distance) * var(--digit-dir-y))
    );
    opacity: 0;
    filter: blur(var(--digit-blur));
  }
  100% { transform: translate(0, 0); opacity: 1; filter: blur(0); }
}

.t-digit-group {
  display: inline-flex;
  align-items: baseline;
}
.t-digit {
  display: inline-block;
  will-change: transform, opacity, filter;
}
.t-digit-group.is-animating .t-digit {
  animation: t-digit-pop-in var(--digit-dur) var(--digit-ease) both;
}
.t-digit-group.is-animating .t-digit[data-stagger="1"] {
  animation-delay: var(--digit-stagger);
}
.t-digit-group.is-animating .t-digit[data-stagger="2"] {
  animation-delay: calc(var(--digit-stagger) * 2);
}

@media (prefers-reduced-motion: reduce) {
  .t-digit-group .t-digit { animation: none !important; }
}
.t-icon-swap {
  position: relative;
  display: inline-grid;
}
.t-icon-swap .t-icon {
  grid-area: 1 / 1;
  transition:
    opacity   var(--icon-swap-dur) var(--icon-swap-ease),
    filter    var(--icon-swap-dur) var(--icon-swap-ease),
    transform var(--icon-swap-dur) var(--icon-swap-ease);
  will-change: opacity, filter, transform;
}
.t-icon-swap[data-state="a"] .t-icon[data-icon="a"],
.t-icon-swap[data-state="b"] .t-icon[data-icon="b"] {
  opacity: 1;
  filter: blur(0);
  transform: scale(1);
}
.t-icon-swap[data-state="a"] .t-icon[data-icon="b"],
.t-icon-swap[data-state="b"] .t-icon[data-icon="a"] {
  opacity: 0;
  filter: blur(var(--icon-swap-blur));

@keyframes t-badge-slide-in {
  from { transform: translate(var(--badge-offset-x), var(--badge-offset-y)); }
  to   { transform: translate(0, 0); }
}

/* .t-badge is the absolutely-positioned wrapper for the dot.
   Adjust top/right (or left/bottom) to anchor it on your trigger. */
.t-badge {
  position: absolute;
  top: -6px;
  right: -8px;
  pointer-events: none;
  will-change: transform;
}
.t-badge[data-open="true"] {
  animation: t-badge-slide-in var(--badge-slide-dur) var(--badge-slide-ease);
}

.t-badge-dot {
  display: block;
  transform-origin: center;
  transform: scale(1);
  opacity: 1;
  filter: blur(0);
  transition:
    transform var(--badge-pop-dur)  var(--badge-pop-ease),
    opacity   var(--badge-fade-dur) var(--badge-pop-ease),
    filter    var(--badge-pop-dur)  var(--badge-pop-ease);
  will-change: transform, opacity, filter;

  transform: scale(0);
  opacity: 0;
  filter: blur(var(--badge-blur));
  transition:
    transform var(--badge-pop-close-dur)  var(--badge-close-ease),
    opacity   var(--badge-fade-close-dur) var(--badge-close-ease),
    filter    var(--badge-pop-close-dur)  var(--badge-close-ease);

.ppad{display:grid;grid-template-columns:repeat(3,72px);gap:12px}.ppad button{height:72px;border-radius:50%;border:1px solid var(--d-line,#ddd);background:rgba(var(--d-pn),.95);font-size:26px;font-weight:500;color:var(--d-ink,#2a2219);display:grid;place-items:center;transition:transform .1s}
.ppad button:active{transform:scale(.93)}.ppad button.ok{background:var(--d-ink,#2a2219);color:var(--d-bg,#fff);border-color:var(--d-ink)}
.pav{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--d-box);border:1px solid var(--d-line);font-weight:700;font-size:13px;flex:none}
.ppl .mini-b.on{background:var(--d-ink);color:var(--d-bg);border-color:var(--d-ink)}
.psel{height:42px;border-radius:11px;border:1px solid var(--d-line,#ddd);background:var(--d-box,#fff);padding:0 10px;font-size:14px;color:var(--d-ink,#222);width:100%}

.insh{width:min(620px,100%)}
.insteps{display:flex;align-items:center;gap:0}.insteps span{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;border:1.5px solid var(--d-line);color:var(--d-ink2);flex:none}
.insteps span.cur{border-color:var(--d-ink);color:var(--d-ink)}.insteps span.done{background:var(--d-ink);border-color:var(--d-ink);color:var(--d-bg)}.insteps i{flex:1;height:1.5px;background:var(--d-line)}
.inlist{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.45}
.inkey{display:flex;align-items:center;gap:8px;margin-top:6px}.inkey code{font:600 16px/1 ui-monospace,Menlo,Consolas,monospace;padding:9px 12px;border-radius:10px;background:var(--d-box);border:1px solid var(--d-line);letter-spacing:.04em}
.indev{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;border:1px dashed var(--d-line);font-size:13.5px}.indev .dot{width:10px;height:10px;border-radius:50%;background:var(--d-amber);flex:none;animation:blink 1.4s ease-in-out infinite}
.indev.on{border-style:solid;border-color:var(--d-ok)}.indev.on .dot{background:var(--d-ok);animation:none}
.inok{display:flex;align-items:center;gap:8px;font-weight:650;color:var(--d-ok)}
.insum{display:flex;flex-direction:column;gap:3px;padding:12px;border-radius:12px;background:var(--d-box);border:1px solid var(--d-line);font-size:13px}
.innav{display:flex;justify-content:space-between;gap:8px;padding-top:6px;border-top:1px solid var(--d-line)}

.tank{grid-template-columns:76px 1fr!important}
.tank .vessel{height:118px!important}
.tank .vessel i.wfill{position:absolute;left:0;right:0;bottom:0;overflow:visible;background:linear-gradient(#7aa5cf,#2f6aa6);transition:height .8s ease}
.wv{position:absolute;left:0;top:-10px;width:200%;height:13px;animation:wave linear infinite;will-change:transform}
.wv path{fill:#7aa5cf}.wv.back{top:-13px}.wv.back path{fill:#b3cde6}
@keyframes wave{to{transform:translateX(-50%)}}
.wstream{position:absolute;top:0;left:50%;width:5px;margin-left:-2.5px;border-radius:0 0 3px 3px;z-index:1;background:repeating-linear-gradient(180deg,rgba(96,150,204,.95) 0 7px,rgba(63,116,168,.6) 7px 12px);background-size:100% 24px;animation:wpour linear infinite}
@keyframes wpour{to{background-position:0 24px}}
.wbub{position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;border:1px solid rgba(255,255,255,.75);background:rgba(255,255,255,.18);animation:wbub ease-in infinite;opacity:0}
@keyframes wbub{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-70px);opacity:0}}
.tank .vessel b{z-index:2}
html.dark .wv path{fill:#4f80b4}html.dark .wv.back path{fill:#36597f}html.dark .tank .vessel i.wfill{background:linear-gradient(#4f80b4,#22497a)}
@media (prefers-reduced-motion:reduce){.wv,.wstream,.wbub{animation:none!important}.wbub{display:none}}
.binv{display:flex;align-items:center;justify-content:space-between;gap:14px}
.bbig{display:flex;flex-direction:column;gap:2px}
.bbig .ser{font-size:44px;line-height:1}
.bbig small{font-family:var(--font);font-size:15px;color:var(--d-ink2);margin-left:2px}
.sub2{font-size:12.5px;color:var(--d-ink2)}
.bseg{position:relative;display:grid;grid-template-columns:repeat(10,1fr);gap:3px;width:150px;height:34px;padding:4px;border:2px solid var(--d-ink3);border-radius:7px}
.bseg i{border-radius:2px;background:var(--d-box)}
.bseg b{position:absolute;right:-7px;top:10px;width:5px;height:12px;border-radius:0 3px 3px 0;background:var(--d-ink3)}
@media (max-width:719px){.bseg{width:110px}}

/* ===== autopilot ===== */
.aimode{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px;border-radius:12px;background:var(--d-box);border:1px solid var(--d-line)}
.aimode button{height:34px;border-radius:9px;font-size:13px;font-weight:650;color:var(--d-ink2)}
.aimode button[aria-pressed=true]{background:var(--d-ink);color:var(--d-bg)}
.k2{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--d-ink2);margin-bottom:6px}
.aiallow{display:flex;flex-wrap:wrap;gap:6px}
.aiallow button{height:28px;padding:0 11px;border-radius:999px;border:1px solid var(--d-line);font-size:12px;font-weight:600;color:var(--d-ink2);display:inline-flex;align-items:center;gap:4px}
.aiallow button[aria-pressed=true]{border-color:rgba(var(--d-amber-rgb),.6);background:rgba(var(--d-amber-rgb),.14);color:var(--d-ink)}
.aic{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}
.r2 .aic{margin-top:0;flex:none}
.btn.sm{height:30px;padding:0 12px;font-size:12.5px;border-radius:999px}
.aiok{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:650;color:var(--d-ok,#2f9e5b)}
.ai-r{align-items:flex-start}
.ai-r .t b{white-space:normal!important;overflow:visible!important;line-height:1.3}
.ai-r .t b::first-letter{text-transform:uppercase}
.lg.ai b{color:var(--d-amber)}
.ai-r{flex-wrap:wrap}.ai-r .aic{width:100%;padding-left:36px;margin-top:2px}
body.dense .aic .btn{height:32px;padding:0 14px;border-radius:999px;font-size:12.5px;font-weight:650;box-shadow:none;background:var(--d-box);border:1px solid var(--d-line);color:var(--d-ink);-webkit-backdrop-filter:none;backdrop-filter:none;text-shadow:none;transition:transform .15s,background .2s}
body.dense .aic .btn.pri{background:var(--d-ink);border-color:var(--d-ink);color:var(--d-bg)}
body.dense .aic .btn:active{transform:scale(.96)}
body.dense .aic .btn::before,body.dense .aic .btn::after{display:none}

/* ===== dock in the power-first style ===== */
body.dense .dock{background:rgba(var(--d-pn),.94)!important;border:1px solid var(--d-line)!important;box-shadow:0 10px 28px rgba(23,19,15,.18)!important;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:20px}
body.dense .dock .db{color:var(--d-ink2);border-radius:14px}
body.dense .dock .db:hover{background:var(--d-box);color:var(--d-ink)}
body.dense .dock .db[aria-current=page]{background:var(--d-ink);color:var(--d-bg);box-shadow:none}
body.dense .dock .t-badge-dot{box-shadow:0 0 0 2px rgba(var(--d-pn),1)}
@media (max-width:460px){.dock{gap:0!important;padding:5px!important;max-width:calc(100vw - 12px)!important}.dock .db{width:calc((100vw - 34px)/9)!important;max-width:44px;height:42px!important}}
</style>
</head>

function curveSVG(){ const W0=470,X0=16,X1=W0-16, xs=TMP.map((_,i)=>X0+i*(X1-X0)/(TMP.length-1)), ys=TMP.map(t=>78-(t-22)*5);
 let d=`M${xs[0]},${ys[0]}`; for(let i=1;i<xs.length;i++){ const cx=(xs[i-1]+xs[i])/2; d+=` C${cx},${ys[i-1]} ${cx},${ys[i]} ${xs[i]},${ys[i]}`; }
 const icons={0:'csun',7:'cloud',8:'csun'};
 const parts=TMP.map((t,i)=>`${icons[i]!==undefined?`<g transform="translate(${xs[i]-10},${ys[i]-48}) scale(.85)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${P[icons[i]]}"/></g>`:''}<text x="${xs[i]}" y="${ys[i]-12}" text-anchor="middle" font-size="14" font-weight="750" fill="#fff">${t}°</text><text x="${xs[i]}" y="122" text-anchor="middle" font-size="11.5" font-weight="500" fill="rgba(255,255,255,.88)">${HRS[i]}</text>`).join('');
 return `<svg viewBox="0 0 ${W0} 128" role="img" aria-label="Temperature for the next 16 hours: 31° now, 32° this afternoon, down to 25° by 2 AM"><defs><linearGradient id="cg" x1="0" x2="1"><stop offset="0" stop-color="#43dd88"/><stop offset="1" stop-color="#2cb7a3"/></linearGradient></defs><path d="${d}" fill="none" stroke="url(#cg)" stroke-width="4.5" stroke-linecap="round"/><circle cx="${xs[0]}" cy="${ys[0]}" r="7" fill="#43dd88" stroke="#fff" stroke-width="2.5"/>${parts}</svg>`; }

const gauss=(m,s)=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return m+s*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};

function rules(){ // same rules as house_sim.py, plus the ACs and iron
 if(LIVE.on) return; // the hub runs the real rules
 if(SIM.v>260) Object.keys(LOADS).forEach(k=>{ if(LOADS[k].spike&&SIM.on[k]) setLoad(k,0,`spike ${Math.round(SIM.v)}V`); });
 if(SIM.src==='inv') Object.keys(LOADS).forEach(k=>{ if(LOADS[k].shed&&SIM.on[k]) setLoad(k,0,'shed: on inverter'); });
 if(SIM.on.pump&&SIM.tank>=95) setLoad('pump',0,`tank at ${Math.round(SIM.tank)}%`);
 if(!SIM.on.pump&&SIM.tank<=20&&(SIM.src==='nepa'||SIM.src==='gen')) setLoad('pump',1,`tank at ${Math.round(SIM.tank)}%`);
 if(SIM.src==='inv'&&SIM.batt<=20.5&&SIM.batt>19.5) slog('ALERT','battery at 20 percent','bad');

   return L('Both ACs are off right now. Nothing is stopping you from switching one on.','The two AC dey off now. Nothing dey stop you to on one.'); }
  case 'nepa': {
   if(s==='nepa'&&f.next>=0) return L(`From the last 14 days, light most often goes around <b>${hh2(f.next)}</b> (${Math.round(f.nextP*100)}% of days at that hour). Good time to pump water and charge things before then.`,`From the last 14 days, light dey usually go around <b>${hh2(f.next)}</b> (${Math.round(f.nextP*100)}% of days for that time). Make you pump water and charge your things before then.`);

function intentOf(q){ q=q.toLowerCase();
 if(/building|estate|block|which.*(on gen|on inverter)|portfolio/.test(q)) return 'estate';
 if(/pump|water|tank|borehole/.test(q)) return 'pump';
 if(/how long|last|battery|inverter|runtime|carry/.test(q)) return 'runtime';
 if(/\bac\b|air ?con|aircon|cool/.test(q)) return 'ac';
 if(/nepa|light (go|dey go|come|go come)|when.*light|outage|power cut/.test(q)) return 'nepa';
 if(/spike|voltage|surge|\btv\b/.test(q)) return 'spike';
 if(/diesel|fuel|gen\b|generator/.test(q)) return 'diesel';
 if(/unit|meter|prepaid|token/.test(q)) return 'units';
 if(/cost|money|spend|naira|₦|bill/.test(q)) return 'cost';
 if(/what.*(on|running|using)|wetin dey|using now|draw/.test(q)) return 'now';
 return 'other'; }
function explainLog(l){ const w=(l.what+' '+l.why).toLowerCase(), thing=l.what.replace(/^(ON|OFF)\s+/,'').toLowerCase(); const nm=Object.values(LOADS).find(x=>x.n.toLowerCase()===thing); const thing2=nm?nm.n:thing;
 if(/shed: on inverter/.test(w)) return L(`At ${l.t} the house went on inverter, so A.D.A. switched off the ${thing2}. Heavy loads like this drain the battery fast; shedding them keeps the inverter going through the night.`,`For ${l.t} house enter inverter, so A.D.A. off the ${thing2}. Heavy things like this dey chop battery quick; to off them make inverter fit carry reach morning.`);
 if(/spike/.test(l.why)) return L(`At ${l.t} the voltage jumped to ${l.why.replace(/\D/g,'')} V. Anything above 260 V can damage electronics, so A.D.A. cut the ${thing} immediately.`,`For ${l.t} voltage jump reach ${l.why.replace(/\D/g,'')} V. Anything wey pass 260 V fit spoil electronics, so A.D.A. off the ${thing} sharp-sharp.`);
 if(/voltage spike/.test(w)) return L(`At ${l.t} the mains voltage spiked to ${l.why.replace(/\D/g,'')} V, well above the safe 200–250 V. Sensitive appliances were protected automatically.`,`For ${l.t} voltage spike reach ${l.why.replace(/\D/g,'')} V, e pass the safe 200–250 V well-well. A.D.A. protect the sensitive appliances by itself.`);
 if(/tank at/.test(l.why)) return /^on/i.test(l.what)?L(`At ${l.t} the tank dropped to ${l.why.replace(/\D/g,'')}% and there was power, so A.D.A. started the pump.`,`For ${l.t} tank drop reach ${l.why.replace(/\D/g,'')}% and light dey, so A.D.A. start the pump.`):L(`At ${l.t} the tank reached ${l.why.replace(/\D/g,'')}%, so A.D.A. stopped the pump before it could overflow.`,`For ${l.t} tank reach ${l.why.replace(/\D/g,'')}%, so A.D.A. off the pump before water go waste.`);
 if(/from dashboard/.test(w)) return L(`Someone switched the ${thing.replace(/ light$/,' light')} from the dashboard at ${l.t}.`,`Person switch the ${thing} from dashboard for ${l.t}.`);
 if(/nepa took light/.test(w)) return L(`At ${l.t} grid power went off and the house moved to the inverter. That's when A.D.A. starts shedding heavy loads.`,`For ${l.t} NEPA take light, house enter inverter. Na that time A.D.A. dey start to off the heavy things.`);
 if(/light is back/.test(w)) return L(`At ${l.t} grid power came back. The battery starts recharging and the pump can run again.`,`For ${l.t} NEPA bring light back. Battery go start to charge and pump fit run again.`);
 if(/gen started/.test(w)) return L(`At ${l.t} the generator came on. The battery charges and heavy loads are allowed again.`,`For ${l.t} gen start. Battery go charge and heavy things fit run again.`);

const DEVS_AI=[
 {id:'pump',kind:'load',grp:'pump',names:['borehole pump','pumping machine','borehole','pump']},
 {id:'acBed',kind:'load',grp:'ac',names:['bedroom ac','bedroom air','ac for bedroom','ac for the bedroom','ac in the bedroom']},
 {id:'acLiv',kind:'load',grp:'ac',names:['living room ac','parlour ac','sitting room ac','ac for parlour','ac in the living room','ac for living room']},
 {id:'fans',kind:'load',grp:'fans',names:['fans','fan']},
 {id:'kettle',kind:'load',grp:'heat',names:['kettle']},
 {id:'iron',kind:'load',grp:'heat',names:['pressing iron','iron']},
 {id:'tv',kind:'load',grp:'tv',names:['television','dstv','tv']},
 {id:'freezer',kind:'load',grp:'protected',names:['freezer']},
 ...LIGHTS.map(([n],i)=>({id:'L'+i,kind:'light',idx:i,grp:i===5?'protected':'lights',names:[n.toLowerCase()+' light',n.toLowerCase()+' lights',(n==='Living room'?'parlour light':'~'),(n==='Living room'?'light for parlour':'~'),'light for '+n.toLowerCase(),'light in '+n.toLowerCase()].filter(x=>x!=='~'),label:n+' light'}))
];
const GRP_LAB={lights:'Lights',pump:'Borehole pump',ac:'ACs',fans:'Fans',heat:'Kettle & iron',tv:'TV'};
S.auto=S.auto||'suggest'; S.allow=S.allow||{lights:true,pump:true,ac:true,fans:true,heat:false,tv:false}; S.aiLog=S.aiLog||[]; S.pendingOn=S.pendingOn||[]; let aiSeq=0;
const devLabel=d=>d.kind==='light'?d.label:LOADS[d.id].n;
const devOn=d=>d.kind==='light'?!!SIM.lights[d.idx]:!!SIM.on[d.id];
function devSet(d,on,why){ if(d.kind==='light'){ SIM.lights[d.idx]=on?1:0; slog(`${on?'ON ':'OFF'} ${d.label.toLowerCase()}`,why,'ai'); } else { const prev=!!SIM.on[d.id]; setLoad(d.id,on,why); if(SIM.log[0]&&prev!==on) SIM.log[0].cls='ai'; rules(); } }
function findDevs(q){ q=' '+q.toLowerCase().replace(/[^a-z ]/g,' ').replace(/\s+/g,' ')+' ';
 if(/ (everything|all) /.test(q)&&!/ light/.test(q)) return {all:true,devs:DEVS_AI.filter(d=>d.grp!=='protected'||false)};
 if(/ all (the )?lights? |lights everywhere| every light /.test(q)) return {devs:DEVS_AI.filter(d=>d.kind==='light'&&d.grp!=='protected')};
 let best=[],len=0; DEVS_AI.forEach(d=>d.names.forEach(n=>{ if(q.includes(' '+n+' ')){ if(n.length>len){ best=[d]; len=n.length; } else if(n.length===len&&!best.includes(d)) best.push(d); } }));
 if(!best.length&&/ (ac|aircon|air condition\w*) /.test(q)) best=DEVS_AI.filter(d=>d.grp==='ac');
 if(!best.length&&/ lights? /.test(q)) best=DEVS_AI.filter(d=>d.kind==='light'&&d.grp!=='protected'&&devOn(d));
 return {devs:best}; }
function parseCommand(q){ const t=q.toLowerCase().trim();
 const isCmd=/^(please |abeg |a\.?d\.?a\.?,? )?(turn|switch|put|start|stop|shut|on|off|pump|kill)\b/.test(t)||/\b(turn|switch) (it |them )?(on|off)\b|\b(on|off) the\b|\bpump water\b/.test(t);
 if(!isCmd) return null;
 let on=/\b(off|stop|shut|kill)\b/.test(t)?false:/\b(on|start)\b|pump water/.test(t)?true:null;
 if(on===null) return null;
 const r=/pump water/.test(t)?{devs:DEVS_AI.filter(d=>d.id==='pump')}:findDevs(t);
 let devs=r.devs; if(/except|but not|leave/.test(t)){ const keep=findDevs(t.split(/except|but not|leave/)[1]).devs.map(d=>d.id); devs=devs.filter(d=>!keep.includes(d.id)); }
 if(r.all&&!on) devs=devs.filter(d=>devOn(d));
 return {on,devs,all:!!r.all}; }
function checkAct(d,on){ // returns null if allowed, else {msg,offer}
 if(isStale()) return {msg:L(`The hub isn't answering, so I won't switch anything until readings are live again.`,`Hub no dey answer, so I no go switch anything till reading come back live.`)};
 if(d.grp==='protected'&&!on) return {msg:L(`I never switch off the ${lc(devLabel(d))}. That one is protected.`,`I no dey ever off the ${lc(devLabel(d))}. E dey protected.`)};
 if(d.grp!=='protected'&&!S.allow[d.grp]) return {msg:L(`You haven't allowed me to control ${lc(GRP_LAB[d.grp])}. You can change that in Autopilot.`,`You never allow me to control ${lc(GRP_LAB[d.grp])}. You fit change am for Autopilot.`)};
 if(on&&d.kind==='load'&&LOADS[d.id].shed&&SIM.src==='inv') return {msg:L(`The ${devLabel(d)} can't come on while you're on inverter: the shed rule keeps it off so the battery lasts (${Math.round(SIM.batt)}% now).`,`${devLabel(d)} no fit on now as you dey on inverter: the shed rule dey keep am off make battery last (${Math.round(SIM.batt)}% now).`),offer:'pending'};
 if(on&&SIM.src==='off') return {msg:L('There is no power at all right now.','No light at all now.')};
 if(on&&d.id==='pump'&&SIM.tank>=95) return {msg:L(`The tank is already at ${Math.round(SIM.tank)}%, so the pump would stop straight away.`,`Tank don already reach ${Math.round(SIM.tank)}%, pump go just off again.`)};

function aiRecord(entry){ entry.id=++aiSeq; entry.t=hhmm(); S.aiLog.unshift(entry); S.aiLog.length=Math.min(S.aiLog.length,10); return entry; }
function aiExecute(e){ e.prev=e.acts.map(a=>({id:a.id,on:devOn(DEVS_AI.find(x=>x.id===a.id))})); e.acts.forEach(a=>devSet(DEVS_AI.find(x=>x.id===a.id),a.on,'A.D.A.: '+e.short)); e.state='done'; }
function aiUndo(id){ const e=S.aiLog.find(x=>x.id===id); if(!e||e.state!=='done') return; if(isStale()){ toast('The hub isn’t answering, so nothing was switched'); return; } e.prev.forEach(p=>devSet(DEVS_AI.find(x=>x.id===p.id),p.on,'undo A.D.A. decision')); e.state='undone'; }
const lc=t=>t.toLowerCase().replace(/\bac\b/g,'AC').replace(/\btv\b/g,'TV').replace(/dstv/g,'DStv');
const listTxt=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+L(' and ',' and ')+a[a.length-1];
const actsTxt=(acts,past)=>listTxt(acts.map(a=>`${a.on?(past?L('turned on','on'):L('turn on','on')):(past?L('turned off','off'):L('turn off','off'))} the ${lc(devLabel(DEVS_AI.find(x=>x.id===a.id)))}`));
function aiCard(e){ return e.state==='ask'?`<span class="aic"><button class="btn pri sm" data-act="aido" data-v="${e.id}">${L('Do it','Do am')}</button><button class="btn sec sm" data-act="aino" data-v="${e.id}">${L('Not now','Not now')}</button></span>`:e.state==='done'?`<span class="aic"><span class="aiok">${ic('check',13,2.6)} ${L('Done','Don do am')}</span><button class="btn sec sm" data-act="aiundo" data-v="${e.id}">${L('Undo','Undo')}</button></span>`:e.state==='undone'?`<span class="aic"><span class="sub">${L('Undone','Don undo am')}</span></span>`:e.state==='no'?`<span class="aic"><span class="sub">${L('Dismissed','You cancel am')}</span></span>`:''; }
function handleCommand(cmd,q){ S.chat=S.chat||[]; S.chat.push({who:'me',t:esc(q)}); S.ov='ask';
 if(S.auto==='off'){ S.chat.push({who:'ai',t:L('Autopilot is off, so I can only answer questions. Switch it to “Ask first” or “Automatic” to let me control things.','Autopilot dey off, so I fit only answer question. Change am to “Ask first” or “Automatic” make I fit control things.')}); update(); return; }
 if(!cmd.devs.length){ S.chat.push({who:'ai',t:L(`I couldn't tell which device you mean${cmd.all?'':''}. Try “turn off the bedroom AC” or “on the parlour light”.`,`I no sabi which one you mean. Try “off the bedroom AC” or “on the light for parlour”.`)}); update(); return; }
 const ok=[],no=[]; cmd.devs.forEach(d=>{ if(devOn(d)===cmd.on){ return; } const c=checkAct(d,cmd.on); if(c) no.push({d,c}); else ok.push({id:d.id,on:cmd.on}); });

 if(!ok.length&&!no.length) msg+=L(`${cmd.devs.length>1?'They are':'It is'} already ${cmd.on?'on':'off'}.`,`E don already ${cmd.on?'on':'off'}.`);
 if(ok.length){ const e=aiRecord({src:'chat',acts:ok,short:L('you asked','you ask am'),text:actsTxt(ok)});
  if(S.auto==='auto'){ aiExecute(e); msg+=L(`Done: I ${actsTxt(ok,true)}.`,`I don ${e.text}.`); } else { e.state='ask'; msg+=L(`Shall I ${e.text}?`,`Make I ${e.text}?`); }
  S.chat.push({who:'ai',t:msg,aiId:e.id}); }
 else S.chat.push({who:'ai',t:msg});
 if(pend.length){ const e=aiRecord({src:'chat',acts:pend.map(x=>({id:x.d.id,on:true})),short:L('NEPA is back, as you asked','NEPA don come, as you talk'),text:L(`turn on the ${pend.map(x=>lc(devLabel(x.d))).join(' and ')} when NEPA or gen returns`,`on the ${pend.map(x=>lc(devLabel(x.d))).join(' and ')} once NEPA or gen come`),state:'offer'});
  S.chat.push({who:'ai',t:L(`Want me to ${e.text}?`,`Make I ${e.text}?`)+`<span class="aic"><button class="btn pri sm" data-act="aipend" data-v="${e.id}">${L('Yes, do that','Yes, do am')}</button></span>`}); }
 update(); }
function aiPropose(key,acts,short,why){ if(S.auto==='off') return; const recent=S.aiLog.find(e=>e.key===key&&Date.now()-e.at<20*60e3); if(recent) return;
 acts=acts.filter(a=>{ const d=DEVS_AI.find(x=>x.id===a.id); return devOn(d)!==a.on&&!checkAct(d,a.on); }); if(!acts.length) return;

 if(S.auto==='auto'){ aiExecute(e); toast(L(`A.D.A. ${e.text}: ${short}`,`A.D.A. ${e.text}: ${short}`)); } else { e.state='ask'; toast(L(`A.D.A. suggests: ${e.text}. See Autopilot.`,`A.D.A. talk say: ${e.text}. Check Autopilot.`)); } }

 aiLastSrc=SIM.src;

// dashboard stops simulating and shows what the hub reports. Opened anywhere

const HUBMAP={freezer:'freezer',pump:'pump',tv:'tv',kettle:'kettle',fans:'fans',acBed:'ac_bed',acLiv:'ac_liv',iron:'iron'};
const HUBREV=Object.fromEntries(Object.entries(HUBMAP).map(([a,b])=>[b,a]));

const BAD_EV=/DELIVERY SHORT|SERVICE DUE|BATTERY LOW|VOLTAGE SPIKE|BATTERY FLAT|DIESEL DROP|DIESEL FINISHED|DEVICE OFFLINE|^ALERT|TANK LOW|DIESEL LOW|TANK OVERFLOWING|NO POWER|NEPA TOOK LIGHT/;
function hubName(n){ if(n==='lights') return 'lights'; const k=HUBREV[n]; return k?LOADS[k].n.toLowerCase():n; }
function hubEv(e){ const m=/^(ON|OFF)\s+(\S+)$/.exec(e.what), what=m?`${m[1]==='ON'?'ON ':'OFF'} ${hubName(m[2])}`:e.what;
 const cls=BAD_EV.test(e.what)?'bad':/^(shed|spike|tank|restored)/.test(e.why||'')?'rule':'';
 return {t:e.time,what,why:e.why||'',cls,hub:1}; }
async function hubFetch(path,body){ const ctl=new AbortController(), to=setTimeout(()=>ctl.abort(),3000);
 const hd=LIVE.token?{'X-ADA-Token':LIVE.token}:{};
 try{ const r=await fetch(LIVE.base+path,body===undefined?{signal:ctl.signal,cache:'no-store',headers:hd}:{method:'POST',headers:Object.assign({'Content-Type':'application/json'},hd),body:JSON.stringify(body),signal:ctl.signal});
  const j=await r.json().catch(()=>({})); if(r.status===401&&j.login) needLogin(); return {ok:r.ok,status:r.status,j}; } finally{ clearTimeout(to); } }
function applyHub(d){
 SIM.src=SRCMAP[d.source]||'off'; SIM.v=d.voltage; SIM.vh.push(d.voltage); if(SIM.vh.length>60) SIM.vh.shift();
 SIM.batt=d.battery; SIM.tank=d.tank; if(typeof d.fuel==='number') SIM.fuel=d.fuel/(d.diesel_cap||DIESEL_CAP)*100;
 LIVE.gen=d.gen||LIVE.gen; LIVE.deliv=d.deliveries||LIVE.deliv; LIVE.fuelMeasured=!!d.fuel_measured; LIVE.battMeasured=!!d.battery_measured; LIVE.dev=d.device||null; LIVE.clock=d.clock;
 (d.loads||[]).forEach(l=>{ if(l.name==='lights') SIM.lights=SIM.lights.map(()=>l.on?1:0); else if(HUBREV[l.name]) SIM.on[HUBREV[l.name]]=l.on?1:0; });
 const h=parseInt(d.clock,10); if(!isNaN(h)) SIM.tl[h]=SIM.src;
 // diesel events from the hub feed the diesel panel's history
 const evs=(d.events||[]);
 evs.slice().reverse().forEach(e=>{ const sig=e.time+'|'+e.what+'|'+e.why; if(LIVE.seenEv.has(sig)) return; LIVE.seenEv.add(sig);
  const m=/([\d.]+) L/.exec(e.why||''); if(m&&(e.what==='DIESEL DROP'||e.what==='DIESEL REFILL')){ SIM.fuelLog.unshift({d:'Today',t:e.time,kind:e.what==='DIESEL DROP'?'theft':'refill',l:e.what==='DIESEL DROP'?-(+m[1]):+m[1],note:e.what==='DIESEL DROP'?'while generator was off':'added at the tank'}); SIM.fuelLog.length=Math.min(SIM.fuelLog.length,8); } });
 const now=Date.now(); LIVE.local=LIVE.local.filter(x=>now-x.ts<180000);
 SIM.log=[...LIVE.local,...evs.map(hubEv)];
 // new alerts: toast once each (not the backlog on first load)
 const al=d.alerts||[]; LIVE.alerts=al;
 if(LIVE.first){ LIVE.seenAlert=al.length?al[0].id:0; LIVE.first=false; }

 SIM.lastOk=Date.now(); SIM.offline=false; }

function demoReport(n){ let seed=11; const rnd=()=>(seed=(seed*9301+49297)%233280)/233280, ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));

  for(let h=0;h<24;h++){ const row=[0,0,0,0]; if(i===0&&h>nowH){ hours.push(row); continue; }
   const src=(nf<=h&&h<nt)||(eve&&h>=19&&h<22)?0:(gf<=h&&h<gt)?1:(flat&&(h===4||h===5))?3:2; row[src]=60; hours.push(row); }
  const sum=k=>hours.reduce((a,r)=>a+r[k],0), grid=sum(0), gen=sum(1), none=sum(3);
  days.push({date:d.toISOString().slice(0,10),hours,min_grid:grid,min_gen:gen,min_none:none,min_inverter:sum(2),gen_l:+(gen/60*GEN_LPH).toFixed(1),refill_l:i%9===4?20:0,drop_l:i===1?6:0,drops:i===1?1:0,pump_min:ri(40,110),wh:ri(9000,16000),spikes:ri(0,3),alerts:ri(0,4),overflow_min:0,offline_min:i%11===5?12:0,batt_min:ri(18,60)}); }
 const F=['min_grid','min_gen','min_inverter','min_none','gen_l','refill_l','drop_l','drops','pump_min','wh','spikes','alerts','overflow_min','offline_min'], tot={};
 F.forEach(f=>tot[f]=+days.reduce((a,d)=>a+d[f],0).toFixed(1)); tot.batt_min=Math.min(...days.map(d=>d.batt_min));
 const dd=days[Math.max(0,days.length-4)].date; return {deliveries:[{date:dd,time:'09:14',vendor:'Sunny Oil',claimed_l:50,price:1300,measured_l:43.5,short_l:6.5},...DEMO_DLV.filter(d=>d.measured_l!=null&&d.date==='Today').map(d=>Object.assign({},d,{date:days[days.length-1].date}))],gen:genStatus(),site:bcfg().site_name||'Demo home, Lekki',diesel_price:+bcfg().diesel_price||1300,from:days[0].date,to:days[days.length-1].date,days_requested:n,days,totals:tot,seeded:true,demo:true,gen_lph:GEN_LPH,diesel_cap:DIESEL_CAP,generated:new Date().toISOString().slice(0,16).replace('T',' ')}; }

// The app re-renders with innerHTML, so animated attributes are rendered in their
// previous state and flipped after a reflow. AN remembers the last value per key.
const AN={}, NUMS={}; let OPENSET=new Set();
function an(key,attr,val,initial){ const p=AN[key]; const start=p===undefined?(initial===undefined?val:initial):p; return `${attr}="${start}" data-ak="${key}" data-aa="${attr}" data-av="${val}"`; }
const np=(k,v)=>`<span class="t-digit-group" data-num="${k}">${v}</span>`;
const checkSVG=(s=18)=>`<span class="t-success-check" ${'%CHK%'}><svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none"><path d="M5 12.5l4.5 4.5L19.5 7" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>`;
const chk=(key,on,s)=>checkSVG(s).replace('%CHK%',an(key,'data-state',on?'in':'out','out'));
const cssMs=(n,fb)=>{ const v=parseFloat(getComputedStyle(document.documentElement).getPropertyValue(n)); return Number.isFinite(v)?v:fb; };
function setDigits(group,str){ // from 02-number-pop-in
 group.classList.remove('is-animating'); group.replaceChildren();
 const chars=str.split('');
 chars.forEach((ch,i)=>{ const span=document.createElement('span'); span.className='t-digit'; span.textContent=ch;
  if(i===chars.length-2) span.dataset.stagger='1'; else if(i===chars.length-1) span.dataset.stagger='2'; group.appendChild(span); });
 void group.offsetHeight; group.classList.add('is-animating'); }
const mkey=el=>(el.classList.contains('t-modal')?'m:':'f:')+(el.getAttribute('aria-label')||el.querySelector('[aria-label]')?.getAttribute('aria-label')||'');
function postRender(root=document){
 // 1. modals and fades: already open → straight to is-open, before anything forces a style flush
 const ms=[...document.querySelectorAll('#layer .t-modal, #layer .t-fade')], fresh=[], keys=new Set();
 ms.forEach(el=>{ const k=mkey(el); keys.add(k); if(OPENSET.has(k)) el.classList.add('is-open'); else fresh.push(el); });
 OPENSET=keys;
 // 2. numbers that changed since the last render pop in
 root.querySelectorAll('[data-num]').forEach(g=>{ const k=g.dataset.num, v=g.textContent; if(NUMS[k]!==undefined&&NUMS[k]!==v) setDigits(g,v); NUMS[k]=v; });
 // 3. success-check paths: measure once per render
 root.querySelectorAll('.t-success-check svg path').forEach(p=>{ const len=Math.ceil(p.getTotalLength())+1; p.style.strokeDasharray=len; p.style.strokeDashoffset=len; });
 // 4. attributes rendered in their old state flip to the new one
 const els=[...root.querySelectorAll('[data-ak]')], pend=els.filter(e=>e.getAttribute(e.dataset.aa)!==e.dataset.av);
 els.forEach(e=>AN[e.dataset.ak]=e.dataset.av);
 if(fresh.length||pend.length){ void document.body.offsetWidth; requestAnimationFrame(()=>{ fresh.forEach(el=>{ el.classList.remove('is-closing'); el.classList.add('is-open'); }); pend.forEach(e=>e.setAttribute(e.dataset.aa,e.dataset.av)); }); }
}
function closeAnim(el,fn){ // from 06-modal: swap is-open for is-closing, clean up after --modal-close-dur
 if(!el){ fn(); update(); return; }
 const closeMs=cssMs('--modal-close-dur',150), sc=el.closest('.t-fade');
 [el,sc].forEach(x=>{ if(x){ x.classList.remove('is-open'); x.classList.add('is-closing'); } });
 setTimeout(()=>{ fn(); update(); },closeMs);
}
function showError(wrap){ // from 12-error-state-shake
 const input=wrap.querySelectorAll('.t-input');
 wrap.classList.add('is-error'); input.forEach(i=>{ i.classList.add('is-error'); i.classList.remove('is-shaking'); void i.offsetWidth; i.classList.add('is-shaking'); });
 const shakeMs=cssMs('--shake-dur-a',80)*2+cssMs('--shake-dur-b',60)*2;
 setTimeout(()=>input.forEach(i=>i.classList.remove('is-shaking')),shakeMs+20);
 if(wrap._revertTimer) clearTimeout(wrap._revertTimer);
 wrap._revertTimer=setTimeout(()=>{ wrap._revertTimer=null; wrap.classList.remove('is-error'); input.forEach(i=>i.classList.remove('is-error')); },shakeMs+cssMs('--revert-hold',3000));
}
document.addEventListener('input',e=>{ const w=e.target.closest('.t-input-wrap'); if(w&&w.classList.contains('is-error')){ if(w._revertTimer){ clearTimeout(w._revertTimer); w._revertTimer=null; } w.classList.remove('is-error'); w.querySelectorAll('.t-input').forEach(i=>i.classList.remove('is-error')); } });
function slideTo(v){ // from 08-page-side-by-side: two pages, flip data-page
